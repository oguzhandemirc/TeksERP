[package]
name = "tekserp-guncelleyici"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "TeksERP güncelleyici hizmeti (TeksERP-Guncelleyici): imzalı backend paketini indirir, doğrular, uygular, gerekirse geri alır"
license.workspace = true

[lib]
name = "tekserp_guncelleyici"
path = "src/lib.rs"

[[bin]]
name = "tekserp-guncelleyici"
path = "src/main.rs"

[features]
# Dışarıdan güven çapası (`TEKSERP_TEST_CAPASI` = JSON dosyası) — YALNIZ test/duman derlemesi.
# Üretim ikilisi özelliksiz çıkar: çapa derlemeye gömülüdür (`tekserp_dogrulama::anchor`).
test-anchor = []

[dependencies]
tekserp-dogrulama.workspace = true
tekserp-hizmet = { path = "../tekserp-hizmet" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
flate2.workspace = true
sha2.workspace = true
base64.workspace = true
regex.workspace = true
getrandom = "0.3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = { version = "3.4", default-features = false }

[target.'cfg(windows)'.dependencies]
# Windows'ta TLS işletim sisteminin (SChannel): C derlemesi yok. Linux'ta aşağıda; macOS (geliştirme) düz http.
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
windows-service.workspace = true
windows-sys.workspace = true
junction = "2.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux (§1.2): sistem OpenSSL'i + SİSTEM CA deposu — kök seçimi kodda (`RootCerts::PlatformVerifier`).
# `native-tls-no-default` YETMEZ: ureq 3.4 bağlayıcıyı yalnız `native-tls` özelliğiyle derler, öteki her https'te panikler.
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }

[target.'cfg(unix)'.dependencies]
# `statvfs` · `openat(O_NOFOLLOW)` · `flock` · süreç grubu `kill` · `prctl(PR_SET_PDEATHSIG)` — kilit dosyasında
# zaten olan crate (yeni crate değil).
libc = "0.2"

[dev-dependencies]
ed25519-dalek.workspace = true
