services:
  postgres:
    image: postgres:16-alpine
    container_name: tekserp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Port DIŞARI açılmıyor — yalnız compose network'ünden erişilebilir.
    # Eğer pgAdmin/DBeaver ile uzaktan bağlanmak istersen alttaki satırı aç:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - statement_timeout=50s
      - -c
      - idle_in_transaction_session_timeout=300000

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tekserp-backend
    restart: unless-stopped
    # Sertleştirme (G22; korumalı compose'un x-guvenlik kalıbı): imaj `node` kullanıcısıyla koşar, kök FS salt okunur,
    # yetki yok, ayrıcalık yükseltme yok. Yazılabilir: /tmp (bellek) + aşağıdaki birimler.
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Europe/Istanbul
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      # Seed yalnız boş şemada VE bu değer 1 iken koşar (docker/entrypoint.sh §2);
      # kurulum betikleri onu yalnız ilk `up`ta verir, .env.docker'a yazılmaz.
      SEED_ON_EMPTY: ${SEED_ON_EMPTY:-0}
    ports:
      # Fabrika ağındaki tüm makineler 4000 portundan erişebilir.
      - "4000:4000"
    volumes:
      - app_data:/app/data
      # Lisans deposu (kurulum anahtarı/kira) ve LAN OTA deposu kalıcı birimde — eskiden konteyner katmanındaydı
      # ve her yeniden yaratmada kayboluyordu; salt okunur kök FS'de tek yazılabilir yerleri bunlar.
      - lisans:/lisans
      - mobil_guncelleme:/mobil-guncelleme
      - ./backups:/backups

volumes:
  pg_data:
  app_data:
  lisans:
  mobil_guncelleme:
