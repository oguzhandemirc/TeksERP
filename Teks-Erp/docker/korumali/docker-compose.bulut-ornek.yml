# =============================================================================
# TeksERP korumalı kurulum — BİZİM YÖNETTİĞİMİZ BULUT SUNUCUSU için 443 kenarı ÖRNEĞİ
# =============================================================================
# Müşteri teslim paketine GİRMEZ (teslim-paketle.sh yalnız docker-compose.yml + .env.ornek taşır);
# müşteri yerindeki sunucuya gelen port açılmaz. Runbook: docs/ops/LINUX-DOCKER-KURULUM.md §10.
# Kullanım: docker-compose.yml'nin yanına `docker-compose.override.yml` adıyla kopyalanır
# (compose onu kendiliğinden birleştirir; teslim dosyasına dokunulmaz). Compose v2.24+ (`!override`).
#
# Tasarımdan (docs/design/BULUT-KURULUM.md T3 · §1.3) bilinçli sapma: kenar Docker'ın port yayınıyla
# DEĞİL konak ağıyla dinler. Docker'ın yayımladığı port ufw'nin önünden geçer; konak ağında 443'e
# ufw'nin "yalnız Cloudflare" kuralları gerçekten uygulanır. Tasarımdaki DOCKER-USER/ipset kenarı
# yazılınca bu örnek emekli olur.
# =============================================================================
services:
  backend:
    environment:
      # Önünde TEK vekil (bu kenar) var; adres ondan bir sıçrama ötede okunur. Kenar X-Forwarded-For'u
      # Cloudflare'in verdiği gerçek adresle EZER, istemcinin yazdığı başlık API'ye ulaşmaz.
      TRUST_PROXY: "1"
      RATE_LIMIT_ENABLED: "true"
      # Bulut sunucusu BARINDIRILAN sınıftadır (ZORUNLU): .env ne derse desin burada sabit.
      TEKSERP_KURULUM_SINIFI: BARINDIRILAN
    # TRUST_PROXY=1 yalnız API portu dışarıya kapalıyken güvenlidir: .env'deki TEKSERP_DINLE ne olursa
    # olsun port yalnız döngü adresinde yayımlanır.
    ports: !override
      - "127.0.0.1:${TEKSERP_PORT:-4000}:4000"

  kenar:
    image: ${TEKSERP_KENAR_IMAJ:-nginx:1.27-alpine}
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs: ["/var/cache/nginx", "/run", "/tmp"]
    cap_drop: ["ALL"]
    # nginx ana süreci 443'e bağlanıp işçileri nginx kullanıcısına düşürür; başka yetki gerekmez.
    cap_add: ["NET_BIND_SERVICE", "SETUID", "SETGID", "CHOWN"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./kenar/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./kenar/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ./kenar/tls:/etc/nginx/tls:ro
    depends_on:
      backend:
        condition: service_healthy
