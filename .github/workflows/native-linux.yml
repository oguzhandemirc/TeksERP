name: Native Linux (güncelleyici çalışma alanı)

# =============================================================================
# NATIVE ÇALIŞMA ALANI — Linux kolu (GUNCELLEYICI-SAGLAMLIK T0, kullanıcı kararı AK-5)
# =============================================================================
# ubuntu-latest üzerinde: biçim + clippy (uyarı = hata) + bütün `cargo test` (`scripts/kapi.mjs`, Mac
# kapısıyla aynı adımlar). Windows kolu `native-windows.yml`de (NTFS junction + gerçek SCM). `ci.yml`
# "native" işi aynı alanı kâhin ve `.node` derlemesiyle ölçer; bu dosya güncelleyicinin Linux arka ucunun
# yeridir — T1 gerçek dumanı (`duman-linux.sh`: systemd + compose + yerel CDN) son adımdır.
# Sır gerekmez; `pull_request_target` KULLANILMAZ (açık repoda PR koduna sır verilmez).
# Yalnız native alan (ya da bu dosya) değişince koşar; `gece/**` push'u da ölçülür (dalga dalları PR'sız).
# =============================================================================

on:
  push:
    branches: [main, "gece/**"]
    paths:
      - "Teks-Erp/native/**"
      - ".github/workflows/native-linux.yml"
  pull_request:
    branches: [main]
    paths:
      - "Teks-Erp/native/**"
      - ".github/workflows/native-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Native Linux (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: Teks-Erp/native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Kaynağı değişen hizmet ikilisinin Cargo sürümü son backend-v* etiketinden büyük mü (sahadaki
      # güncelleyici eşit sürümü almaz). Sığ klonda etiket yok: yalnız backend-v* etiketleri derinlik 1 çekilir.
      - name: Güncelleyici sürüm bekçisi (test_guncelleyici_surum)
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin '+refs/tags/backend-v*:refs/tags/backend-v*'
          node scripts/test_guncelleyici_surum.mjs --sonda
          node scripts/test_guncelleyici_surum.mjs
      - name: Rust araç zinciri (stable + rustfmt + clippy)
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      # Anahtar kilit dosyası + araç zinciri sürümü; ara anahtar bayat target'ı geri getirir (cargo yeniden derler).
      - name: rustc sürümü (önbellek anahtarı)
        id: rustc
        run: echo "surum=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            Teks-Erp/native/target
          key: cargo-native-linux-${{ steps.rustc.outputs.surum }}-${{ hashFiles('Teks-Erp/native/Cargo.lock') }}
          restore-keys: |
            cargo-native-linux-${{ steps.rustc.outputs.surum }}-
      - name: Biçim + clippy (bütün çalışma alanı, Linux yerel hedef)
        run: node scripts/kapi.mjs denetle
      - name: cargo test (vektörler + durum makinesi + öldür-yeniden başlat, Linux dosya sistemi)
        run: node scripts/kapi.mjs test
      # L6 (§4.3): gerçek systemd'de taban birim + ek dosya + Type=notify + gözcü + Restart=always + kaldırma; ek olarak
      # OnFailure= + Restart=always ölçümü (notice, karar girdisi — W1b L-C). Compose/imaj YOK (o T1'in).
      - name: L6 systemd dumanı (sudo, gerçek systemd)
        run: |
          cargo build -p tekserp-guncelleyici --bin tekserp-guncelleyici
          bash scripts/duman-systemd.sh "$PWD/target/debug/tekserp-guncelleyici"
      # W1b (GUNCELLEYICI-SAGLAMLIK §4.7): L-B satırını taşıyan TEST birimiyle gerçek systemd — silinen/kesilen ikili,
      # kill -9, yönetici mask'ı, tavan, küçük tmpfs'te disk dolu. Test derlemesinin ikilisi (yeniden derleme yok).
      - name: Onarım dumanı (gerçek systemd, duman-linux-onarim.sh)
        run: cargo build --locked -p tekserp-guncelleyici && bash scripts/duman-linux-onarim.sh target/debug/tekserp-guncelleyici
      # L4b — Linux arka ucunun GERÇEK Docker ayağı (K1'in gerçeği; T1 dumanı DEĞİL): DockerServices durum/başlat/
      # durdur/çökme eşlemesi, doğrulama kipi değişkeni, `unless-stopped` + `compose stop` yatışması, araç yetimi yok.
      # Test imajı önceden yerelleşir; testin compose'u `pull_policy: never` (hiçbir şey çekmez). docker.io imajları
      # Docker Hub 429 sınırı yüzünden yalnız mirror.gcr.io aynasından (aynı digest; bekçi test_docker_hijyeni §5p).
      - name: Docker arka ucu (gerçek Docker, L4b)
        env:
          TEKSERP_DOCKER_TEST: "1"
          TEKSERP_DOCKER_TEST_IMAJ: mirror.gcr.io/library/busybox:1.36
        run: |
          docker version --format 'docker {{.Server.Version}} · compose {{.Client.Version}}'
          docker compose version
          for deneme in 1 2 3; do docker pull -q mirror.gcr.io/library/busybox:1.36 && break; [ "$deneme" = 3 ] && exit 1; sleep 20; done
          cargo test -p tekserp-guncelleyici --test docker_gercek -- --nocapture
      # T1 (GUNCELLEYICI-SAGLAMLIK §9.1 K2): gerçek Linux dünyası — `kur` ile ilk kurulum (systemd birimi, gerçek compose
      # şablonu, test imajları), yerel CDN'den OTOMATİK güncelleme, düşen göç → veri geri yükleme, işlem ortasında kill -9
      # ve `systemctl restart docker`, loop iş diskinde indirme sürerken disk dolu. Test çapalı ikili release derlenir
      # (200 MB'lık imaj arşivlerinin özeti debug'da dakikalar sürer); fikstür `tests/duman_linux.rs`.
      - name: T1 Linux gerçek dumanı (duman-linux.sh)
        run: |
          cargo build --release --locked -p tekserp-guncelleyici --features test-anchor --bin tekserp-guncelleyici
          bash scripts/duman-linux.sh target/release/tekserp-guncelleyici
