name: Okuma servisi

# Yerel okuma servisi (okuma/, Python + RapidOCR) — okuma/, bu dosya ya da sözleşme testinin okuduğu
# Teks-Erp dosyaları (okuma-istemcisi.ts Zod şeması, motor fikstürleri) değişince koşar.
# CPU-only ubuntu; sistem Python 3.12 (ubuntu-24.04), bağımlılıklar --require-hashes ile.
# Modeller manifestten (SHA-256) çekilir ve önbelleğe alınır; testler ağ engelliyken açılışı AYRICA ölçer.

on:
  push:
    branches: [main]
    paths: ["okuma/**", ".github/workflows/okuma.yml", "Teks-Erp/src/lib/gelen-belge/okuma-istemcisi.ts", "Teks-Erp/src/lib/gelen-belge/motor/__tests__/fikstur/**"]
  pull_request:
    branches: [main]
    paths: ["okuma/**", ".github/workflows/okuma.yml", "Teks-Erp/src/lib/gelen-belge/okuma-istemcisi.ts", "Teks-Erp/src/lib/gelen-belge/motor/__tests__/fikstur/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Okuma servisi (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: okuma
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: okuma/modeller/*.onnx
          key: okuma-modeller-${{ hashFiles('okuma/modeller/manifest.json') }}
      - name: Sanal ortam + hash'li bağımlılıklar
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Modeller (manifest + SHA-256)
        run: .venv/bin/python betikler/modelleri-getir.py
      - name: pytest
        run: .venv/bin/python -m pytest -q
