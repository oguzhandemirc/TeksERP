name: CI

# TeksERP monorepo — 3 alt proje (Teks-Erp backend, Electron panel, mobil) + satıcı sunucusu (satici/sunucu)
# + native lisans çekirdeği (Teks-Erp/native/lisans-cekirdek, Rust).
# + patron bulutu sunucusu (patron/sunucu) + patron uygulaması (patron/uygulama).
# Her push + PR'da tip kontrolü + test takımları koşar. Backend testleri yerel
# PostgreSQL gerektirir (service container + migrate deploy + seed); Electron
# (Vitest/jsdom) ve mobil (jest-expo) DB'siz çalışır.

on:
  push:
    # Müşteri dalı YOK: fabrika paketi ve demo derlemesi `main`den üretilir, müşteri
    # farkı yalnız bayrak profilinde yaşar (kök CLAUDE.md § Dallanma). `adnansahin`
    # 2026-09-02'de emekli oldu — tetikleyicide bırakmak "o dalda da koşuyor"
    # yanılsaması üretir ve emekli dalı yaşıyor gösterirdi.
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# En az yetki: bütün işler salt-okunur; PR'a yorum yazma izni yalnız teşhis adımı olan `backend` işinde.
permissions:
  contents: read

# Aynı PR'a yeni push gelince eskiyen koşu iptal edilir (kuyruk public repo koşucu sınırında birikiyordu).
# push/dispatch grubu ref başına sabittir (iptal yok): koşan main koşusu kesilmez, ara commit'lerin
# BEKLEYEN koşusu yenisi gelince düşer — her merge'ün tam koşusu kuyrukta birikiyordu; en yeni main hep koşar.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # DEĞİŞİKLİK SÜZGECİ — yalnız PR'da etkilenmeyen işi atlar; push (main) ve
  # workflow_dispatch'te HER bayrak true (tam güvenlik ağı main'de). Bağımlılıklar
  # ölçüldü 2026-10-31 (göreli import + `"X", "y"` yol birleşimi taraması); şüphede KOŞAR.
  # Backend işleri süzgeçsizdir: bekçiler `git ls-files` ile bütün depoyu tarar.
  # Satıcı/native/patron/mobil/yük dar listesi import kapanışından gelir: kapanışa yeni Teks-Erp dosyası girince
  # buradaki desen de genişler (kaçan PR'ı main push'un tam koşusu yakalar).
  # ===========================================================================
  changes:
    name: Değişiklik süzgeci
    runs-on: ubuntu-latest
    outputs:
      electron: ${{ steps.suz.outputs.electron }}
      mobil: ${{ steps.suz.outputs.mobil }}
      satici: ${{ steps.suz.outputs.satici }}
      satici_web: ${{ steps.suz.outputs.satici_web }}
      native: ${{ steps.suz.outputs.native }}
      patron: ${{ steps.suz.outputs.patron }}
      load_test: ${{ steps.suz.outputs.load_test }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Değişen yollardan iş bayrakları
        id: suz
        shell: bash
        env:
          OLAY: ${{ github.event_name }}
          TABAN: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          BAYRAKLAR="electron mobil satici satici_web native patron load_test"
          hepsi() {
            echo "⏩ süzgeç yok ($1) → bütün işler koşar"
            for b in $BAYRAKLAR; do echo "$b=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }
          [ "$OLAY" = "pull_request" ] || hepsi "olay: $OLAY"
          # Fark alınamazsa fail-open: yanlış atlama main'i kırar, fazla koşu yalnız zamandır.
          liste=$(git diff --name-only "origin/$TABAN...HEAD") || hepsi "fark alınamadı"
          [ -n "$liste" ] || hepsi "boş fark"
          echo "Değişen dosyalar:"; echo "$liste" | sed 's/^/  /'
          var() { grep -qE "$1" <<<"$liste"; }
          # ORTAK: iş akışları, kök betikler (lint tavanı, kapı kapsamı, sürüm kapıları), deploy kayıtları,
          # kökteki .md dışı dosyalar (surum-notlari.json, Dockerfile, …) → her iş.
          kok_dosya=$(grep -E '^[^/]+$' <<<"$liste" | grep -vE '\.md$' || true)
          if var '^(\.github/|scripts/|deploy/)' || [ -n "$kok_dosya" ]; then
            hepsi "ortak yapılandırma değişti"
          fi
          karar() {
            if var "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; echo "✅ $1 koşar"
            else echo "$1=false" >> "$GITHUB_OUTPUT"; echo "⏭ $1 atlanır"; fi
          }
          # Electron testleri Teks-Erp/src (+ bütün src'yi okuyan ayna), prisma şeması, Teks-Erp/scripts/lib, mobil/src okur.
          karar electron   '^(Electron/|Teks-Erp/(src|prisma|scripts)/|mobil/src/)'
          # mobil testleri Electron/shared (lan-tls) ve Teks-Erp/src'nin ŞU dosyalarını metin olarak okur (2026-10-31 taraması):
          # app.ts, discovery route/servis, lib/lan-tls, constants/module-flags + number-series-catalog. Teks-Erp'ten import yok.
          karar mobil      '^(mobil/|Electron/shared/|Teks-Erp/src/(app\.ts|routes/discovery|services/discovery|lib/lan-tls/|constants/(module-flags|number-series-catalog)))'
          # Satıcı (+ macOS töreni): Teks-Erp'ten import kapanışı = src/lib (lisans, backup-crypto, hizmet-duzeni, pg-session),
          # constants/module-*, services/helpers/pg-tool, scripts/lib'in lisans/imza/paket dosyaları + törenin koşturduğu
          # araç betikleri; native test vektörleri; Electron/electron + mobil + patron. Teks-Erp test_*.ts'leri satıcıyı etkilemez.
          karar satici     '^(satici/|Teks-Erp/(src/lib/|src/constants/module-|src/services/helpers/pg-tool|scripts/lib/(bilinen-guvenli-db|butunluk-imza|ci-kokeni|cli-girdi|git|guncelleyici-blok|guven-capasi|hedef-db-kapisi|kabul-metni|lisans-|oci-|paket-sertifika|panel-imza|senaryo-lisans|thinkpad-kokeni|varsayilan-superadmin)|scripts/(yedek-sifrele|panel-imza|build-korumali-imza|backend-bildirim|guven-capasi-ekle|senaryo-lisans|build-araclar|kabul-metni-uret)\.|native/|package|tsconfig)|Electron/electron/|mobil/|patron/)'
          karar satici_web '^satici/'
          # Native: Cargo alanı + kâhinin import kapanışı (src/lib/license, services/helpers/pg-tool, scripts/lib/atlama + lisans-*)
          # + Rust testlerinin okuduğu docker/korumali; Teks-Erp npm ci → package*.
          karar native     '^Teks-Erp/(native/|src/lib/license/|src/services/helpers/pg-tool|scripts/lib/(atlama|lisans-)|scripts/test_lisans_native_kahin|docker/korumali/|package|tsconfig)'
          # Patron: Teks-Erp'ten import yok; bekçiler metin okur: src/cloud-sync, src/lib/license/protocol,
          # scripts/test_bulut_tel_aynasi; satici/sunucu/src; uygulama mobil/assets okur.
          karar patron     '^(patron/|Teks-Erp/src/(cloud-sync/|lib/license/protocol/)|Teks-Erp/scripts/test_bulut_tel_aynasi|satici/sunucu/src/|mobil/)'
          # Yük testi bütün sunucuyu ölçer (src + şema + seed); yalnız doküman/bekçi dosyası değişince atlanır.
          karar load_test  '^Teks-Erp/(src/|prisma/|prisma\.config|package|tsconfig|scripts/load_test)'

  # ===========================================================================
  # DOKÜMAN BEKÇİSİ — docs'un koda karşı bayatlamasını önler (zero-dep, DB'siz, hızlı).
  # GATE: ölü doküman-link (taşınmış/silinmiş dosyaya atıf) → fail.
  # ADVISORY: kaldırılmış-sembol atıfları (fail etmez, log'da görünür).
  # ===========================================================================
  docs:
    name: Doküman bekçisi (link + bayatlık)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Teks-Erp/package-lock.json
      # test_grup_yayin_kapisi §8 gerçek imza aracını (Teks-Erp/scripts/panel-imza.ts) tsx ile koşturur.
      - name: Teks-Erp bağımlılıkları (yayın kapısı §8 gerçek imza aracı)
        run: npm ci
        working-directory: Teks-Erp
      - name: Doküman tutarlılık kontrolü
        run: node scripts/check-docs.mjs
      # Migration hijyeni — asıl değeri YERELDE (untracked migration/test yakalar).
      # CI'da checkout temiz olduğu için burada her zaman yeşildir; GATE 3
      # (migration.sql eksik dizin) yine gerçek koruma sağlar ve adımın varlığı
      # kuralı dokümante eder. Gerekçe: scripts/check-migrations.mjs başlığı.
      - name: Migration hijyeni (commit edilmemiş migration/test)
        run: node scripts/check-migrations.mjs
      # Sürüm numarası kuralı — ağ İSTEMEZ (git etiketleri geçici bir depoda
      # kurulur). Bu kural sessiz bozulur: yanlış tarafa kayarsa ya numaralar
      # atlanır, ya hiç artmaz, ya da yayındaki bir numaranın üstüne yazılır —
      # üçü de ancak sahada fark edilir.
      - name: Sürüm numarası kuralı
        run: node scripts/test_surum.mjs
      # Yayın bildirimi yardımcısı (Faz 3d): portala imzalı bildirim yayını ASLA durdurmaz; üç kanca
      # yayından SONRA çağırır. Zero-dep, DB'siz, ağsız (sahte fetch).
      - name: Yayın bildirimi yardımcısı (3d)
        run: node scripts/test_yayin_bildirim.mjs
      # Play mağaza girişi kaynakları (patron/uygulama/magaza, mobil/magaza): Play metin sınırları, görsel boyut/alfa,
      # maskesiz ekran görüntüsü ve inceleme hesabı izi yok. Zero-dep, ağsız.
      - name: Play mağaza girişi
        run: node scripts/test_play_magaza.mjs
      # Deneme kurulumu verisi (scripts/deneme-veri): anonimleştirme sözlüğü belirlenimli + idempotent, kod/numara
      # dokunulmaz, telefon deseni UUID/barkod parçasını saymaz, doldurma tokenı belirlenimli. Zero-dep, DB'siz, ağsız.
      - name: Deneme verisi (anonimleştirme + doldurma çekirdeği)
        run: node scripts/test_deneme_veri.mjs && node scripts/test_deneme_veri.mjs --sonda
      # Lisans devreye alma ölçüm betikleri (runbook docs/ops/LISANS-DEVREYE-ALMA-TESTFABRIKA.md) canlı VDS'e ve
      # testfabrika'ya bakar: varsayılan KURU, --olc ile bile yalnız OKUMA. Zero-dep, DB'siz, ağsız (tuzak altında);
      # kalıcı negatif + pozitif sondalar aynı adımda.
      - name: Lisans devreye alma betikleri kuru kipte ağa çıkmaz
        run: node scripts/test_lisans_devreye_kuru.mjs
      # Sürüm notu kapısı — paketleme kapısının CI İKİZİ. 2026-09-14'e kadar bu
      # kapı YALNIZ paketleme/OTA yolunda koşuyordu: not eksikse hata, sahaya
      # çıkmaya HAZIRLANIRKEN (çoğu zaman gece) görülüyordu. Sürümler künyeden
      # (`Electron/package.json` · `mobil/app.json`) okunur, iş akışına SABİT
      # yazılmaz — sabit yazılsaydı sürüm yükseldiğinde kapı eski numarayı
      # doğrular, yani hiçbir şey doğrulamazdı. Künye okunamazsa kapı ÖLÇÜLEMEDİ
      # deyip KIRMIZI verir (fail-closed), sessizce atlamaz.
      - name: Sürüm notu kapısı (künyeden okunan panel + tablet sürümü)
        run: node scripts/check-surum-notlari.mjs --kunyeden
      # Korumalı paket çalışma zamanı kaydı (deploy/node-surumu.json) — tek kaynak
      # tutarlılığı + tüketicilerin onu okuduğu. Ağsız (SHA biçimi ölçülür; resmî
      # SHASUMS doğrulaması yalnız yerelde --ag ile). Zero-dep, DB'siz.
      - name: Node sürüm kaydı (korumalı paket runtime)
        run: node scripts/test_node_surumu.mjs
      # Oturum test DB aracı (scripts/test-db.mjs): ad kapısı, klon kaynağı (rolls>0 RED), silme kararı + kalıcı sondalar.
      # Gerçek DB kolu (§3) yerel Docker PG ister; CI'da --dbsiz ile ⏭ beyanlı. Zero-dep, ağsız.
      - name: Test DB aracı (saf kararlar + sondalar)
        run: node scripts/test_test_db_araci.mjs --dbsiz && node scripts/test_test_db_araci.mjs --sonda
      # Kendi PostgreSQL örneği (deploy/pg/): kayıt + sözleşme + şablon yasakları (yalnız 127.0.0.1,
      # yalnız scram-sha-256, trust yok, UTC, initdb UTF8/C) + altın vektörler. Ağsız; indirme +
      # SHA256 ayrı iş akışında (pg-ikili.yml — yalnız deploy/pg değişince).
      - name: Kendi PostgreSQL örneği (kayıt + şablon yasakları)
        run: node scripts/test_pg_ornegi.mjs && node scripts/test_pg_ornegi.mjs --sonda
      # Sahaya giden PG paketi (deploy/pg/pg-paketle.mjs): gölge kökte sahte EDB zip'iyle gerçek koşum — EDB özeti,
      # paket manifestosu ya da kök düzeni saparsa DURUR, anahtarsız koşum imza adımında durur. Zero-dep, DB'siz,
      # ağsız (fetch tuzaklı); Info-ZIP zip/unzip + git ister (ubuntu imajında var).
      - name: PG paketi üretimi (pg-paketle)
        run: node scripts/test_pg_paketle.mjs
      # Müşteriye portalda TEK bağlantıyla giden kurulum arşivi (deploy/kurulum/kurulum-arsivi.mjs): gölge kökte,
      # imza doğrulayıcısı kayıt tutan koçan — setup'ın kararları arşivden ÖNCE verilir, sapma DURUR. Zero-dep, ağsız.
      - name: Kurulum arşivi (tek bağlantı)
        run: node scripts/test_kurulum_arsivi.mjs
      # Derleme deposuna koyma (deploy/satici/derleme-koy.mjs): sahte ssh/scp ile KURU kipte yalnız okuma, var olan
      # derleme ezilmez, --uygula sırası vds-dogrula arasında. Zero-dep, ağsız.
      - name: Derleme deposuna koyma (derleme-koy)
        run: node scripts/test_derleme_koy.mjs
      # Windows kod imzası hazırlığı (B9): sertifika yokken uyarı + çıkış 0 (bugünkü davranış), varken imza +
      # doğrulama düşerse durur; setup ve panel yolu adımı taşır. Zero-dep, ağsız; pwsh varsa gerçek koşum.
      - name: Kod imzası adımı (B9)
        run: node scripts/test_kod_imzasi.mjs
      # İlk kurulum deposu yayını (deploy/kurulum/ilk-kurulum-yayinla.mjs): grup + terfi kapısı (test otomatik,
      # oncu/genel açıklamalı terfi etiketi), setup sürümü = paket, backend-yayinla girdi sözleşmesi. Zero-dep, ağsız.
      - name: İlk kurulum deposu yayını (grup + terfi)
        run: node scripts/test_ilk_kurulum_yayinla.mjs
      # Yayın betiklerinde belirteçsiz HTTP okuma yok (3c') — güncelleme sunucusu Cloudflare
      # Worker'la anonim okumaya kapalı; anonim okuma kalırsa Worker açıldığı gün yayın zinciri
      # kırılır. Zero-dep, DB'siz, ağsız; kapı ve kalıcı sondalar (--sonda) aynı adımda.
      - name: Yayın okumaları belirteçli/SSH (3c')
        run: node scripts/check-yayin-okuma.mjs && node scripts/check-yayin-okuma.mjs --sonda
      # Tek ortak paket O1: dağıtım kaydı (kapalı şema · grup zinciri · türetim · eski kanaldan ayrılık) ve
      # eski kanal kaydının (adnansahin) bayt-donukluğu. Zero-dep, DB'siz, ağsız; sığ klonda çapa kolu ⏭ beyanlı.
      - name: Dağıtım kaydı + eski kanal donuk (O1) + profil matrisi yayın kapısı (O13b)
        run: node scripts/check-dagitim.mjs && node scripts/check-dagitim.mjs --sonda && node scripts/test_eski_kanal_donuk.mjs && node scripts/test_eski_kanal_donuk.mjs --sonda && node scripts/test_profil_raporu_kapisi.mjs && node scripts/test_panel_kimlik.mjs && node scripts/test_grup_yayin_kapisi.mjs
      # 3.2: yeni indirme kökeni (indir.etkiliyazilim.com) compose + nginx — eski siteden ayrı, kenar zinciri CF birebir.
      - name: İndirme kökeni (3.2)
        run: node scripts/test_indir_sunucusu.mjs && node scripts/test_indir_sunucusu.mjs --sonda
      # Play K2: herkese açık gizlilik sayfası (tekserp.etkiliyazilim.com/gizlilik) — kaynak ↔ html, compose, nginx, kablolama.
      - name: Gizlilik sayfası (Play K2)
        run: node scripts/test_gizlilik_sayfasi.mjs && node scripts/test_gizlilik_sayfasi.mjs --sonda
      # Tek ortak paket O7: tablet ortak kimliği (kayıt ↔ ortak-kimlik.cjs ↔ app.config.js ↔ build-apk ortak yolu).
      # O10b: tablet grup yayını (ortak OTA paketi + APK; sahte ssh/scp/curl/npx, ağsız).
      - name: Tablet ortak paket kimliği (O7) + tablet grup yayını (O10b)
        run: node scripts/test_tablet_ortak_paket.mjs && node scripts/test_tablet_ortak_paket.mjs --sonda && node scripts/test_grup_yayin_tablet.mjs
      # Play yayıncısı: AAB → dahili/kapalı test (sahte fetch, ağsız; üretim reddi, versionCode, not sınırı, anahtar sızıntısı).
      - name: Play yayıncısı (deploy/play-yayinla.mjs)
        run: node scripts/test_play_yayinla.mjs

  # ===========================================================================
  # BACKEND — Express + Prisma; Postgres service + migrate deploy + seed + test
  # ===========================================================================
  # PARÇALI (2026-10-12): sıralı paket ~40 dk sürüyordu. Üç iş:
  #   backend-lint  — lint + lint tavanı + iki tsc (DB'siz, parçaları beklemez)
  #   backend-test  — bekçiler 8 parçada; HER parça kendi runner'ında kendi
  #                   Postgres'i + migrate + seed + seed:fixtures + HTTP sunucularıyla
  #                   koşar (ortak ayar yazan bekçiler parçalar arası karışmaz)
  #   backend       — ÖZET, ad "Backend (tsc + test)" korunur: iki iş de başarılı ∧
  #                   parçaların GERÇEKTE koştuğu dosyaların birleşimi = diskteki bütün
  #                   bekçiler, kesişim boş (sessiz atlanan bekçi = kırmızı).
  # Dağıtım + birleşim tek kaynak: `Teks-Erp/scripts/lib/parca.ts`; parça sayısı
  # yalnız aşağıdaki matrix listesi ile `--shard …/8`de yazılı ve `test_ci_parca`
  # ikisinin hizasını ölçer.
  backend-lint:
    name: Backend lint + tsc
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: Teks-Erp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Teks-Erp/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Lint
        run: set -o pipefail; npm run lint 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
      # Lint UYARILARI kapı değildir (eslint uyarıyla 0 döner) — tavan onları sayar
      # ve yalnız DÜŞMESİNE izin verir; yoksa `warn` kuralları sessizce birikir.
      - name: Lint tavanı (baseline)
        run: set -o pipefail; node scripts/check-lint-baseline.mjs --proje=backend 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
        working-directory: .
      - name: Type-check (yalnız src)
        run: set -o pipefail; npx tsc --noEmit 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
      # scripts/ + prisma/ AYRI adım: kök tsconfig `include: ["src/**/*"]` ile sınırlı
      # olduğu için 222 test dosyası uzun süre HİÇ derlenmedi → bir servisin imzası ya
      # da bir enum değişince src yeşil kalıyor, testler de yeşil kalıyor, ama testin
      # doğruladığı ŞEY sessizce boşa düşüyordu (2026-08-01 denetimi: 87 tip hatası).
      # Parçalar `SKIP_TYPECHECK=1` ile koşar: koşucunun tip geçidi BURADA bir kez
      # koşar (8 kez değil) ve özet iş bu işin yeşilini şart koşar.
      - name: Type-check (scripts + prisma)
        run: set -o pipefail; npm run typecheck:scripts 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
        # scripts programı yerelde ~4.2 GB tutuyor; varsayılan V8 yığını sınırda OOM veriyordu (K4P-LAB, ölçüldü).
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # TEŞHİS: iş başarısız olursa logun sonunu PR'a yorum olarak yaz
      # (GitHub MCP'de Actions log erişimi yok → gerçek hatayı buradan okuruz).
      - name: Hata logunu PR'a yaz
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## ❌ Backend CI hata logu — lint + tsc (otomatik teşhis)"
            echo '```'
            tail -150 /tmp/ci-backend.log || echo "(log yok)"
            echo '```'
          } > /tmp/ci-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/ci-comment.md --repo "${{ github.repository }}"
        shell: bash

  backend-test:
    name: Backend test ${{ matrix.parca }}/8
    runs-on: ubuntu-latest
    # İş düzeyi izin üst düzeyin YERİNE geçer: contents:read burada da yazılı.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      # Bir parça düşse de ötekiler sonuna kadar koşar: kırmızıların HEPSİ tek koşumda görünür.
      fail-fast: false
      matrix:
        parca: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: Teks-Erp
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teks_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teks_ci?schema=public
      # ⚠️ `test_identity_ledger` §1 YÖN A bir MANDAL ve tabanı DİNAMİK. CI'da
      # `HEAD == origin/main` olduğu için merge-base HEAD'in KENDİSİDİR ⇒ karşılaştırılan
      # iki şey birebir ⇒ mandal ORADA YOKTUR (ölçüldü 2026-09-13; sessizce yeşil basıyordu).
      # Push'tan ÖNCEKİ uç gerçek bir tabandır ve bir push 1–2 commit taşıyor (ölçüldü) ⇒
      # bu değer push'un TAMAMINI kapsar. ⚠️ İlk push/force-push'ta `000…0` gelir; bekçi
      # onu ve çözülemeyen sha'yı ELEYİP "YÖN A ÖLÇÜLMEDİ" diye BEYAN eder (sessiz yeşil YOK).
      CI_BEFORE_SHA: ${{ github.event.before }}
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: "4000"
      # Tip geçidi `backend-lint`te koşar; koşucu atlamayı "GEÇİT ATLANDI" diye beyan eder.
      SKIP_TYPECHECK: "1"
      TEKSERP_PARCA_KAYIT: /tmp/parca/parca-${{ matrix.parca }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # TAM KLON (2026-09-14): `test_harita_sonda_atfi §1b` `(bu commit)` satırının sha'sını
        # `git blame`den türetir; sığ klonda (varsayılan depth 1) blame sınır (^) döner ve satır
        # 'havada' kalır — CI c2635fc1 bunu 12/1 ile gösterdi. Bekçi sığ klonda ⏭ beyan eder;
        # burada derinlik verilir ki CI DA ölçsün (koşum yeri ölçüm koşuludur).
        with:
          fetch-depth: 0
      # Backend'in ÇALIŞMA ZAMANI Node 24'tür (korumalı paket runtime, deploy/node-surumu.json).
      # CI de o çizgide ölçer ki "kod bu Node'da koşar" sinyali gerçek olsun (Faz 2b).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Teks-Erp/package-lock.json
      - run: npm ci
      # ÖLÇÜM (kapı DEĞİL): istemci ↔ sunucu PostgreSQL sürümleri. `pgTool()`
      # `PG_BIN_DIR` yoksa PATH'ten okur ve HİÇBİR YERDE uyum ölçülmüyor; istemci
      # sunucudan yeniyse alınan dump o sunucuya GERİ YÜKLENEMEZ (ölçüldü
      # 2026-09-13: istemci 18.6 ↔ sunucu 16.15 → `SET transaction_timeout` PG17+).
      # ⚠️ Her satır başarısızlığını ADIYLA basar (üç etiket beklenir) ve boruya
      #    sokulmaz: `psql … | sed … || echo` içinde `||` sed'in çıkışını görür.
      - name: PostgreSQL istemci/sunucu sürümü (ölçüm)
        run: |
          pg_dump --version || echo "ISTEMCI-DUMP: pg_dump YOK"
          psql --version    || echo "ISTEMCI-PSQL: psql YOK"
          srv=$(psql "${DATABASE_URL%%\?*}" -tAc "SHOW server_version" 2>&1) \
            && echo "SUNUCU: $srv" \
            || echo "SUNUCU: OKUNAMADI ($srv)"
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate deploy (tüm migration'ları uygula)
        run: npx prisma migrate deploy
      - name: Seed (temel kurulum — admin, istasyonlar, şablonlar)
        run: set -o pipefail; npm run seed 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
      # ⚠️ AYRI ADIM ve ZORUNLU: `npm run seed` TEMİZ FABRİKA kurar (müşteri/renk/ürün
      # YOK — üretimde fabrika kendi ekler). Test scriptlerinin business-key ile
      # çözdüğü iş fixture'ları (PATOS ürünü, MAVI renk, MUS-001 müşterisi, IST şubesi)
      # YALNIZ `seed:fixtures`'ta doğar. Bu adım eksikti → backend testlerinin 73'ü
      # "Seed fixture eksik: PATOS" ile düşüyordu ve bu, CI zaten lint'te kırmızı
      # olduğu için ~2 hafta GÖRÜLMEDİ. Idempotent (code üzerinden upsert).
      - name: Seed fixtures (test iş verisi — PATOS/MAVI/MUS-001)
        run: set -o pipefail; npm run seed:fixtures 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
      # HTTP AYAKLI BEKÇİLER (2026-09-06) — beş bekçi kendi portunda bir sunucu
      # bekler; yoksa o bölümleri SESSİZCE atlar. Ölçüldü: CI'da 53 kontrol hiç
      # koşmuyordu ve içlerinde İKİ GERÇEK ARIZA saklıydı.
      #
      # ⚠️ YALNIZ CI'DA. Yerel koşucuya süreç yönetimi SOKULMAZ: kök CLAUDE.md
      # "ikinci Node süreci yasak" ve `pkill -f tsx` yasağı orada geçerli. Burada
      # ortam zaten sıfırdan kuruluyor ve job bitince kendi kendine gidiyor.
      # Her parça KENDİ sunucularını açar: HTTP bekçisi hangi parçaya düşerse düşsün ölçer.
      #
      # ⚠️ Portlar bekçilerin VARSAYILANLARIDIR (`TEST_API_URL` verilmezse bunlar
      # kullanılır): finance 4100 · module_flag_off 4101 · superadmin 4104 ·
      # settings_password 4112 · module_profile 4122.
      #
      # ⚠️ NOTIFICATION_JOBS_ENABLED=false (2026-10-25): bu sunucular bildirim bayrağını gözetmen turunda
      # (15 sn) görünce DAĞITICI açıyordu — outbox olayını bekçiden önce kapıp zili kendi hub'ına
      # çalıyor (`test_bildirim_zil` §5b "gelmedi", özet rev 0) ve 5 fazla LISTEN açıyordu
      # (`test_bildirim_motoru` §11e/f "dinleyen 5"). Aralıklıydı: bayrağın açık penceresine bir turun düşmesine bağlı.
      - name: HTTP ayaklı bekçiler için sunucuları başlat
        run: |
          set -o pipefail
          for port in 4100 4101 4104 4112 4122; do
            NOTIFICATION_JOBS_ENABLED=false PORT=$port npx tsx src/server.ts > "/tmp/ci-srv-$port.log" 2>&1 &
            echo "$!" >> /tmp/ci-srv-pids.txt
          done
          # Sağlık kapısı: hepsi ayağa kalkana kadar bekle. Kalkmayan varsa
          # SESSİZCE devam etme — atlanan kontrol yeşil sayılır ve kapsam kaybı
          # yine görünmez olurdu.
          for port in 4100 4101 4104 4112 4122; do
            for i in $(seq 1 60); do
              if curl -sf "http://localhost:$port/health" > /dev/null; then break; fi
              if [ "$i" = "60" ]; then
                echo "❌ Sunucu ayağa kalkmadı: $port"; tail -30 "/tmp/ci-srv-$port.log"; exit 1
              fi
              sleep 1
            done
            echo "✅ $port hazır"
          done
          # Boot uzlaştırmaları (izin kataloğu 3 sn · varsayılan depo 5 sn) açılıştan SONRA
          # koşar; sıralı pakette tip geçidi (~60 sn) bu süreyi örtüyordu, parça ise hemen
          # başlar (ölçüldü 2026-10-12: `test_allocation_repair` "Varsayılan depo yok").
          # En geç doğanı (varsayılan depo) ölçerek bekle; doğmazsa sessiz geçme.
          for i in $(seq 1 60); do
            n=$(psql "${DATABASE_URL%%\?*}" -tAc 'SELECT count(*) FROM warehouses WHERE "isDefault"' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then echo "✅ boot uzlaştırması: varsayılan depo hazır"; break; fi
            if [ "$i" = "60" ]; then echo "❌ varsayılan depo 60 sn'de doğmadı"; exit 1; fi
            sleep 1
          done

      # ⚠️ DIŞLAMA YOK — ve bu bir ÖLÇÜM sonucudur, tercih değil.
      # `TEKSERP_HARIC: test_hook_config` buradaydı; kalem `a8ce49ca`de kapandı ve
      # bekçi ana pakete DÖNDÜ. ⚠️ *Bir muafiyet, gerekçesi bittiği gün kaldırılmazsa
      # KALICI olur.* Dışlama özet işin birleşim denetimini de KIRMIZIYA çevirir.
      # ⭐ Yeniden dışlama gerekirse reçete: `scripts/run-all-tests.ts` içinde
      #   `TEKSERP_HARIC` başlığı (giriş ölçütü + ayrı job'ın tuzağı).
      - name: Test suite (scripts/test_*.ts runner)
        run: set -o pipefail; npm test -- --shard ${{ matrix.parca }}/8 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash

      # Parça kaydı: birleşim denetimi GERÇEKTE koşan dosyaları buradan okur.
      # Kayıt yoksa (koşucu sona ulaşmadı) yükleme sessiz geçer, eksiği özet iş yakalar.
      - name: Parça kaydını yükle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parca-${{ matrix.parca }}
          path: /tmp/parca/parca-${{ matrix.parca }}.json
          if-no-files-found: ignore
          retention-days: 7

      # Kendi başlattığımız PID'ler — `pkill` YOK (kök CLAUDE.md yasağı).
      - name: Sunucuları durdur
        if: always()
        run: |
          if [ -f /tmp/ci-srv-pids.txt ]; then
            while read -r pid; do kill "$pid" 2>/dev/null || true; done < /tmp/ci-srv-pids.txt
          fi
        shell: bash
      # TEŞHİS: parça başarısız olursa logun sonunu PR'a yorum olarak yaz
      # (GitHub MCP'de Actions log erişimi yok → gerçek hatayı buradan okuruz).
      - name: Hata logunu PR'a yaz
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## ❌ Backend CI hata logu — parça ${{ matrix.parca }}/8 (otomatik teşhis)"
            echo '```'
            tail -150 /tmp/ci-backend.log || echo "(log yok)"
            echo '```'
          } > /tmp/ci-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/ci-comment.md --repo "${{ github.repository }}"
        shell: bash

  backend:
    name: Backend (tsc + test)
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    # `always()`: bir parça düşse de birleşim denetimi koşar ve kırmızının ADRESİNİ basar.
    if: always()
    defaults:
      run:
        working-directory: Teks-Erp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Teks-Erp/package-lock.json
      - run: npm ci
      - name: Parça kayıtlarını indir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: parca-*
          path: /tmp/parca
          merge-multiple: true
      - name: Parça birleşimi (her bekçi TAM bir parçada koştu mu)
        run: npx tsx scripts/run-all-tests.ts --birlesim /tmp/parca
      # Ölçülen sürelerle tazelenmiş süre tablosu: dengesi bozulunca bu dosya
      # `Teks-Erp/scripts/ci-parca-sureleri.json` üstüne konur.
      - name: Tazelenmiş süre tablosunu yükle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-parca-sureleri
          path: /tmp/parca/ci-parca-sureleri.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Lint + tsc ve bütün parçalar başarılı mı
        if: always()
        run: |
          echo "backend-lint: ${{ needs.backend-lint.result }} · backend-test: ${{ needs.backend-test.result }}"
          [ "${{ needs.backend-lint.result }}" = "success" ] && [ "${{ needs.backend-test.result }}" = "success" ]
        shell: bash

  # ===========================================================================
  # YÜK TESTİ — HTTP throughput / p50-p95-p99 ölçümü (Node eşzamanlılığı, yeni paket
  # YOK). continue-on-error: paylaşımlı runner'da geçici yavaşlama PR'ı BLOKLAMASIN —
  # amaç ölçüm + ciddi regresyon (N+1/kilit/hata patlaması) sinyali. a11y + yapısal
  # snapshot testleri Electron job'unun `npm test`'inde otomatik koşar (ek job yok).
  # ===========================================================================
  load-test:
    name: Yük testi (throughput/p95)
    needs: changes
    if: needs.changes.outputs.load_test == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: Teks-Erp
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teks_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teks_ci?schema=public
      # ⚠️ `test_identity_ledger` §1 YÖN A bir MANDAL ve tabanı DİNAMİK. CI'da
      # `HEAD == origin/main` olduğu için merge-base HEAD'in KENDİSİDİR ⇒ karşılaştırılan
      # iki şey birebir ⇒ mandal ORADA YOKTUR (ölçüldü 2026-09-13; sessizce yeşil basıyordu).
      # Push'tan ÖNCEKİ uç gerçek bir tabandır ve bir push 1–2 commit taşıyor (ölçüldü) ⇒
      # bu değer push'un TAMAMINI kapsar. ⚠️ İlk push/force-push'ta `000…0` gelir; bekçi
      # onu ve çözülemeyen sha'yı ELEYİP "YÖN A ÖLÇÜLMEDİ" diye BEYAN eder (sessiz yeşil YOK).
      CI_BEFORE_SHA: ${{ github.event.before }}
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: "4000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Teks-Erp/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate deploy
        run: npx prisma migrate deploy
      - name: Seed (temel kurulum)
        run: npm run seed
      # Backend job'ıyla aynı gerekçe: iş fixture'ları ayrı seed'de doğar. Yük testi
      # bugün PATOS'a bağlı olmasa bile ortamı aynı tutmak (ölçüm karşılaştırılabilir
      # kalsın) ve ileride veri-bağımlı bir senaryo eklenince sessizce düşmemek için.
      - name: Seed fixtures (test iş verisi)
        run: npm run seed:fixtures
      - name: Yük testi (npm run test:load)
        run: npm run test:load

  # ===========================================================================
  # ELECTRON — React 19 / Vite 7 renderer; Vitest (jsdom). Electron binary GEREKMEZ.
  # ===========================================================================
  # BÖLÜNDÜ (2026-10-31): tek iş ~12 dk kritik yoldu (vitest 8 dk). lint+tsc ayrı iş, vitest
  # `--shard` ile 3 dilim (vitest 3.2); özet iş eski adı korur.
  electron-lint:
    name: Electron lint + tsc
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Electron
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # renderer testleri binary istemez → hızlı/güvenli kurulum
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Electron/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Lint tavanı (baseline)
        run: node scripts/check-lint-baseline.mjs --proje=electron
        working-directory: .
      # ⚠️ ÇIPLAK `npx tsc --noEmit` BURADA HİÇBİR DOSYAYI DERLEMEZ: kök tsconfig
      # `files: []` + `references` taşır ve `-b` olmadan referanslara girilmez. Adım
      # 2026-09-05'e kadar no-op'tu; 9 tip hatası main'de bir gün durdu.
      - name: Type-check
        run: npm run typecheck
      # ⚠️ KAPI KAPSAMI BURADA ÖLÇÜLÜR, Backend job'ında DEĞİL (2026-09-13).
      # `test_kapi_kapsami` üç projeyi de Backend'den ölçüyordu; orada yalnız
      # Teks-Erp'in bağımlılıkları kurulu olduğu için Electron/mobil configleri
      # "çözülemedi" deyip ÜÇ TUR kırmızı verdi. Beyan (atla()) o kırmızıyı
      # GÖRÜNÜR kıldı ama KAPATMADI — kapsam, bağımlılıkları KURULU olan kendi
      # job'ında ölçülür. Adım `npm ci`den SONRA gelir; öncesinde aynı
      # "çözülemedi" ikinci kez üretilirdi.
      - name: Kapı kapsamı (tip kapısı SIFIR dosya derlemiyor)
        run: node scripts/kapi-kapsami.mjs Electron
        working-directory: .

  electron-test:
    name: Electron vitest ${{ matrix.dilim }}/3
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dilim: [1, 2, 3]
    defaults:
      run:
        working-directory: Electron
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Electron/package-lock.json
      - run: npm ci
      - name: Test (Vitest)
        run: npm test -- --shard=${{ matrix.dilim }}/3

  # ÖZET: süzgeç Electron'u istediyse iki iş de success; istemediyse ikisi de skipped. Süzgeç
  # düşerse (bağımlılar sessizce skipped olur) özet KIRMIZI.
  electron:
    name: Electron (tsc + vitest)
    runs-on: ubuntu-latest
    needs: [changes, electron-lint, electron-test]
    if: always()
    steps:
      - name: Lint + tsc ve bütün vitest dilimleri
        shell: bash
        env:
          SUZGEC: ${{ needs.changes.result }}
          ISTENDI: ${{ needs.changes.outputs.electron }}
          LINT: ${{ needs.electron-lint.result }}
          TEST: ${{ needs.electron-test.result }}
        run: |
          echo "süzgeç: $SUZGEC (electron=$ISTENDI) · lint+tsc: $LINT · vitest: $TEST"
          [ "$SUZGEC" = "success" ] || { echo "❌ süzgeç işi başarısız"; exit 1; }
          if [ "$ISTENDI" = "true" ]; then beklenen=success; else beklenen=skipped; fi
          [ "$LINT" = "$beklenen" ] && [ "$TEST" = "$beklenen" ]

  # ===========================================================================
  # MOBİL — Expo 54 / RN 0.81; jest-expo (node ortamı, native build GEREKMEZ).
  # ===========================================================================
  mobile:
    name: Mobil (tsc + jest)
    needs: changes
    if: needs.changes.outputs.mobil == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobil/package-lock.json
      - run: npm ci
      # `eslint .` (expo lint DEĞİL): expo lint yol verilmezse App.tsx/index.ts/
      # config/plugins/scripts dizinlerini görmez — kapı ile baseline aynı kümeyi
      # ölçmezse "tavan aşılmadı" cümlesi anlamını yitirir (MOBIL.md [MO-37]).
      - name: Lint
        run: npm run lint
      - name: Lint tavanı (baseline)
        run: node scripts/check-lint-baseline.mjs --proje=mobil
        working-directory: .
      - name: Type-check
        run: npx tsc --noEmit
      # ⚠️ KAPI KAPSAMI BURADA ÖLÇÜLÜR, Backend job'ında DEĞİL (2026-09-13).
      # `test_kapi_kapsami` üç projeyi de Backend'den ölçüyordu; orada yalnız
      # Teks-Erp'in bağımlılıkları kurulu olduğu için Electron/mobil configleri
      # "çözülemedi" deyip ÜÇ TUR kırmızı verdi. Beyan (atla()) o kırmızıyı
      # GÖRÜNÜR kıldı ama KAPATMADI — kapsam, bağımlılıkları KURULU olan kendi
      # job'ında ölçülür. Adım `npm ci`den SONRA gelir; öncesinde aynı
      # "çözülemedi" ikinci kez üretilirdi.
      - name: Kapı kapsamı (tip kapısı SIFIR dosya derlemiyor)
        run: node scripts/kapi-kapsami.mjs mobil
        working-directory: .
      - name: Test (jest-expo)
        run: npx jest --runInBand

  # ===========================================================================
  # SATICI — lisans satıcı sunucusu (satici/sunucu); kendi PG'si + migrate deploy + bekçi koşucusu.
  # Backend job'ıyla aynı node + PG sürümü. Satıcı bekçileri protokol TEK KAYNAĞINI ve fikstürü
  # `Teks-Erp/src/lib/license/protocol` + `Teks-Erp/scripts/lib/lisans-fikstur`ten içe aktarır ⇒
  # Teks-Erp bağımlılıkları da kurulur (zod oradan çözülür; tip kapısı da onları görür).
  # DB adı `_test` ile biter: satıcı koşucusunun hedef DB kapısı başka adı REDDEDER (fail-closed).
  # ===========================================================================
  satici:
    name: Satıcı (tsc + lint + bekçi)
    needs: changes
    if: needs.changes.outputs.satici == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satici/sunucu
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tekserp_satici_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tekserp_satici_ci_test?schema=public
      SATICI_ERISIM_GUNLUGU: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            satici/sunucu/package-lock.json
            Teks-Erp/package-lock.json
      - name: Teks-Erp bağımlılıkları (ortak protokol + bekçi fikstürü)
        run: npm ci
        working-directory: Teks-Erp
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate deploy (satıcı migration'ları)
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Lint tavanı (baseline)
        run: node scripts/check-lint-baseline.mjs --proje=satici
        working-directory: .
      - name: Type-check (src · src + scripts)
        run: npm run typecheck:plain && npm run typecheck:scripts:plain
      - name: Kapı kapsamı (tip kapısı SIFIR dosya derlemiyor)
        run: node scripts/kapi-kapsami.mjs satici/sunucu
        working-directory: .
      # Tören bekçisi (test_uretim_toren.ts) ayrı birim olarak macOS RAM diski ister → aşağıdaki
      # satici-toren-mac işinde koşar; koşucu çıkarmayı yalnız o iş ci.yml'de duruyorsa yapar (yoksa KIRMIZI).
      - name: Satıcı bekçileri
        env:
          SATICI_TOREN_MAC_ISINDE: "1"
        run: npx tsx scripts/run-all-tests.ts

  # ===========================================================================
  # SATICI ÜRETİM TÖRENİ — macOS. Tören Mac'te yapılır; yedek anahtar ayrı birime (/Volumes/<USB>)
  # yazılır ve bekçi o birimi hdiutil RAM diskiyle kurar ("kurulamazsa KIRMIZI, atlama yok"). Tören
  # aracının /Volumes kuralı darwin'e özgüdür — Linux'ta ölçülse aynı güvence ölçülmezdi. DB'siz.
  # ===========================================================================
  satici-toren-mac:
    name: Satıcı üretim töreni (macOS RAM diski)
    needs: changes
    if: needs.changes.outputs.satici == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: satici/sunucu
    env:
      TEKSERP_PAROLA_KASASI: kapali
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            satici/sunucu/package-lock.json
            Teks-Erp/package-lock.json
      - name: Teks-Erp bağımlılıkları (tören klonuna kopyalanır)
        run: npm ci
        working-directory: Teks-Erp
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Üretim töreni bekçisi
        run: npx tsx scripts/test_uretim_toren.ts

  # ===========================================================================
  # SATICI WEB — portal web arayüzü (satici/web; React + Vite). DB'siz: tip + lint + vitest (ayna
  # bekçisi sunucu KAYNAĞINI metin olarak okur, sunucu bağımlılığı gerekmez) + iki derleme (portal ·
  # bayi) — derleme kırılırsa satıcı sunucusu arayüzsüz (404) kalır.
  # ===========================================================================
  satici-web:
    name: Satıcı web (tsc + lint + vitest + build)
    needs: changes
    if: needs.changes.outputs.satici_web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satici/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: satici/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck:plain
      - name: Kapı kapsamı (tip kapısı SIFIR dosya derlemiyor)
        run: node scripts/kapi-kapsami.mjs satici/web
        working-directory: .
      - name: Test (vitest)
        run: npx vitest run
      - name: Derleme (portal + bayi)
        run: npm run build

  # ===========================================================================
  # NATIVE — Cargo çalışma alanı (Teks-Erp/native): lisans çekirdeği (Rust + napi-rs, Faz 2c) + ORTAK
  # doğrulama crate'i + güncelleyici/backend hizmet konağı (Dağıtım v2). DB'siz: biçim + clippy
  # (uyarı = hata, bütün alan) + `cargo test` (TS kâhininin vektör dosyası + durum makinesi birimleri)
  # + linux-x64 `.node` + kâhin bekçisi GERÇEK `.node`a karşı. TEKSERP_STRICT: bekçinin "ATLANDI"sı
  # burada KIRMIZIDIR (backend job'ı native derlemez; orada sayılı beyanla atlar). Hizmet ikililerinin
  # Windows derlemesi + SCM dumanı `native-windows.yml`de; üretim özellikli (test çapasız) win-x64 +
  # linux-x64 paket derlemesi `korumali-paket.yml`de (Faz 2b sahipliği).
  # ===========================================================================
  native:
    name: Native çalışma alanı (fmt + clippy + test + kâhin)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Teks-Erp/native/lisans-cekirdek
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Teks-Erp/native/lisans-cekirdek/package-lock.json
            Teks-Erp/package-lock.json
      - name: Rust araç zinciri (stable + rustfmt + clippy)
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      # Yalnız GERİ YÜKLE (kaydetme yok — depo önbelleği 10 GB tavanında): native-linux.yml'in main önbelleği
      # kayıt + bağımlılık derlemesini taşır; bayat target'ı cargo parmak iziyle yeniden derler.
      - name: rustc sürümü (önbellek anahtarı)
        id: rustc
        run: echo "surum=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            Teks-Erp/native/target
          key: cargo-native-linux-${{ steps.rustc.outputs.surum }}-${{ hashFiles('Teks-Erp/native/Cargo.lock') }}
          restore-keys: |
            cargo-native-linux-${{ steps.rustc.outputs.surum }}-
      - name: Teks-Erp bağımlılıkları (kâhin — TS protokolü + tsx)
        run: npm ci
        working-directory: Teks-Erp
      - run: npm ci
      - name: Biçim + clippy (bütün çalışma alanı)
        run: node ../scripts/kapi.mjs denetle
      - name: cargo test (TS kâhininin vektörleri + güncelleyici/konak birimleri)
        run: node ../scripts/kapi.mjs test
      - name: Native derleme (linux-x64-gnu, test çapalı)
        run: npx napi build --platform --release --no-js --features test-anchor --output-dir dist
      # G3: kâhinin §9 sondası gerçek üretim ikilisini ister (STRICT'te yoksa kırmızı); çapa tek kip.
      - name: Native derleme (linux-x64-gnu, üretim çapalı)
        run: npx napi build --platform --release --no-js --output-dir dist-uretim
      - name: Kâhin bekçisi (TS ↔ gerçek .node)
        run: npx tsx scripts/test_lisans_native_kahin.ts
        working-directory: Teks-Erp
        env:
          TEKSERP_STRICT: "1"

  # ===========================================================================
  # PATRON — patron bulutu sunucusu (patron/sunucu); kendi PG'si + migrate deploy + ÇALIŞMA ROLLERİ +
  # bekçi koşucusu. RLS bekçisi uygulama/eşitleme rolünün NOSUPERUSER NOBYPASSRLS olduğunu ölçer →
  # roller `scripts/db-rolleri.ts` ile kurulur (göç rolü = konteynerin süper kullanıcısı). Rol
  # parolaları yalnız bu geçici konteynerde geçerlidir (sır değil). DB adı `_test` ile biter.
  # ===========================================================================
  patron:
    name: Patron sunucusu (tsc + lint + RLS + bekçi)
    needs: changes
    if: needs.changes.outputs.patron == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patron/sunucu
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tekserp_patron_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tekserp_patron_ci_test?schema=public
      DATABASE_URL: postgresql://tekserp_patron_ci_test_app:ci-uygulama-rolu-parolasi@localhost:5432/tekserp_patron_ci_test?schema=public
      ESITLEME_DATABASE_URL: postgresql://tekserp_patron_ci_test_sync:ci-esitleme-rolu-parolasi@localhost:5432/tekserp_patron_ci_test?schema=public
      PATRON_ERISIM_GUNLUGU: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: patron/sunucu/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate deploy (patron migration'ları)
        run: npx prisma migrate deploy
      - name: Çalışma rolleri (uygulama + eşitleme; NOSUPERUSER NOBYPASSRLS)
        run: npx tsx scripts/db-rolleri.ts
      - name: Lint
        run: npm run lint
      - name: Lint tavanı (baseline)
        run: node scripts/check-lint-baseline.mjs --proje=patron
        working-directory: .
      - name: Type-check (src · src + scripts)
        run: npm run typecheck:plain && npm run typecheck:scripts:plain
      - name: Kapı kapsamı (tip kapısı SIFIR dosya derlemiyor)
        run: node scripts/kapi-kapsami.mjs patron/sunucu
        working-directory: .
      - name: Patron bekçileri
        run: npx tsx scripts/run-all-tests.ts

  # ===========================================================================
  # E2E — Electron uygulaması gerçekten açılıp Login render oluyor mu (Playwright
  # _electron.launch). Headless Linux'ta xvfb gerekir. continue-on-error: CI'da
  # olası kırılganlık unit job'larını BLOKLAMASIN (E2E sinyali yine görünür).
  # ===========================================================================
  e2e:
    name: Electron E2E (smoke)
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # apt aynası bir koşumda ~55 dk takıldı; asılan iş inişi bekletmesin (continue-on-error ile koşu yeşil kalır)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Electron
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Electron/package-lock.json
      - run: npm ci # E2E electron binary İSTER → ELECTRON_SKIP_BINARY_DOWNLOAD verilmez
      - name: Playwright + Electron sistem bağımlılıkları
        # yalnız Chromium bağımlılıkları (Electron = Chromium); firefox/webkit apt yükü inmez
        run: npx playwright install-deps chromium
      - name: E2E (build + headless launch)
        run: xvfb-run --auto-servernum npm run e2e

  # ===========================================================================
  # PATRON UYGULAMASI — patron/uygulama (Expo; telefon/tablet/web). DB'siz: tip + kapı kapsamı + jest
  # (ayna bekçisi sunucuyu yalnız DOSYA olarak okur — katalog üretilmiş `katalog-ozeti.json`dan; sunucu
  # kaynağı içe aktarılmaz, node_modules'ü bu işte kurulmaz) + web dışa aktarımı. ESLint izinli paket
  # değil ⇒ lint adımı yok (commit kapısında da `lint: null`).
  # ===========================================================================
  patron-uygulama:
    name: Patron uygulaması (tsc + jest + web export)
    needs: changes
    if: needs.changes.outputs.patron == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patron/uygulama
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: patron/uygulama/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck:plain
      - name: Kapı kapsamı (tip kapısı SIFIR dosya derlemiyor)
        run: node scripts/kapi-kapsami.mjs patron/uygulama
        working-directory: .
      - name: Test (jest — ekran mantığı, önbellek, istemci, ayna)
        run: npx jest --runInBand
      - name: Web dışa aktarımı
        run: npx expo export --platform web --output-dir dist
        env:
          CI: "1"
          EXPO_PUBLIC_PATRON_API: https://patron.ornek.invalid
