name: CI

# TeksERP monorepo — 3 alt proje (Teks-Erp backend, Electron panel, mobil).
# Her push + PR'da tip kontrolü + test takımları koşar. Backend testleri yerel
# PostgreSQL gerektirir (service container + migrate deploy + seed); Electron
# (Vitest/jsdom) ve mobil (jest-expo) DB'siz çalışır.

on:
  push:
    # ⚠️ `adnansahin` SAHAYA ÇIKAN daldır (fabrikanın sürümü oradan paketlenir) —
    # `main` ise entegrasyon dalı. CI 2026-08-29'a kadar YALNIZ `main`e bağlıydı;
    # ölçüldü (BULGU-T1-015): o tarihte `adnansahin`de 140 commit, 33 migration ve
    # 67 yeni bekçi vardı ve HİÇBİRİ otomatik koşmamıştı. Yani "testler yeşil"
    # cümlesi fabrikaya giden kod için hiçbir zaman doğrulanmamıştı.
    branches: [main, adnansahin]
  pull_request:
    branches: [main, adnansahin]
  workflow_dispatch:

# Teşhis adımının PR'a yorum yazabilmesi için (yeni repolarda varsayılan token
# salt-okunur). Tüm job'lar yalnız checkout (contents:read) + PR yorum (pull-requests:write).
permissions:
  contents: read
  pull-requests: write

jobs:
  # ===========================================================================
  # DOKÜMAN BEKÇİSİ — docs'un koda karşı bayatlamasını önler (zero-dep, DB'siz, hızlı).
  # GATE: ölü doküman-link (taşınmış/silinmiş dosyaya atıf) → fail.
  # ADVISORY: kaldırılmış-sembol atıfları (fail etmez, log'da görünür).
  # ===========================================================================
  docs:
    name: Doküman bekçisi (link + bayatlık)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Doküman tutarlılık kontrolü
        run: node scripts/check-docs.mjs
      # Migration hijyeni — asıl değeri YERELDE (untracked migration/test yakalar).
      # CI'da checkout temiz olduğu için burada her zaman yeşildir; GATE 3
      # (migration.sql eksik dizin) yine gerçek koruma sağlar ve adımın varlığı
      # kuralı dokümante eder. Gerekçe: scripts/check-migrations.mjs başlığı.
      - name: Migration hijyeni (commit edilmemiş migration/test)
        run: node scripts/check-migrations.mjs

  # ===========================================================================
  # BACKEND — Express + Prisma; Postgres service + migrate deploy + seed + test
  # ===========================================================================
  backend:
    name: Backend (tsc + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Teks-Erp
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teks_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teks_ci?schema=public
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Teks-Erp/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate deploy (tüm migration'ları uygula)
        run: npx prisma migrate deploy
      - name: Seed (temel kurulum — admin, istasyonlar, şablonlar)
        run: set -o pipefail; npm run seed 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
      # ⚠️ AYRI ADIM ve ZORUNLU: `npm run seed` TEMİZ FABRİKA kurar (müşteri/renk/ürün
      # YOK — üretimde fabrika kendi ekler). Test scriptlerinin business-key ile
      # çözdüğü iş fixture'ları (PATOS ürünü, MAVI renk, MUS-001 müşterisi, IST şubesi)
      # YALNIZ `seed:fixtures`'ta doğar. Bu adım eksikti → backend testlerinin 73'ü
      # "Seed fixture eksik: PATOS" ile düşüyordu ve bu, CI zaten lint'te kırmızı
      # olduğu için ~2 hafta GÖRÜLMEDİ. Idempotent (code üzerinden upsert).
      - name: Seed fixtures (test iş verisi — PATOS/MAVI/MUS-001)
        run: set -o pipefail; npm run seed:fixtures 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
      - name: Lint
        run: set -o pipefail; npm run lint 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
      - name: Type-check (yalnız src)
        run: set -o pipefail; npx tsc --noEmit 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
      # scripts/ + prisma/ AYRI adım: kök tsconfig `include: ["src/**/*"]` ile sınırlı
      # olduğu için 222 test dosyası uzun süre HİÇ derlenmedi → bir servisin imzası ya
      # da bir enum değişince src yeşil kalıyor, testler de yeşil kalıyor, ama testin
      # doğruladığı ŞEY sessizce boşa düşüyordu (2026-08-01 denetimi: 87 tip hatası).
      # `npm test` bunu zaten geçit olarak koşar; burada AYRI adım olmasının sebebi
      # teşhis: kırmızı olan şeyin "tip driftı" mi "gerçek test regresyonu" mu olduğu
      # adım adından okunsun.
      - name: Type-check (scripts + prisma)
        run: set -o pipefail; npm run typecheck:scripts 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
      - name: Test suite (scripts/test_*.ts runner)
        run: set -o pipefail; npm test 2>&1 | tee -a /tmp/ci-backend.log
        shell: bash
      # TEŞHİS: backend job'ı başarısız olursa logun sonunu PR'a yorum olarak yaz
      # (GitHub MCP'de Actions log erişimi yok → gerçek hatayı buradan okuruz).
      - name: Hata logunu PR'a yaz
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## ❌ Backend CI hata logu (otomatik teşhis)"
            echo '```'
            tail -150 /tmp/ci-backend.log || echo "(log yok)"
            echo '```'
          } > /tmp/ci-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/ci-comment.md --repo "${{ github.repository }}"
        shell: bash

  # ===========================================================================
  # YÜK TESTİ — HTTP throughput / p50-p95-p99 ölçümü (Node eşzamanlılığı, yeni paket
  # YOK). continue-on-error: paylaşımlı runner'da geçici yavaşlama PR'ı BLOKLAMASIN —
  # amaç ölçüm + ciddi regresyon (N+1/kilit/hata patlaması) sinyali. a11y + yapısal
  # snapshot testleri Electron job'unun `npm test`'inde otomatik koşar (ek job yok).
  # ===========================================================================
  load-test:
    name: Yük testi (throughput/p95)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: Teks-Erp
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teks_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teks_ci?schema=public
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Teks-Erp/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate deploy
        run: npx prisma migrate deploy
      - name: Seed (temel kurulum)
        run: npm run seed
      # Backend job'ıyla aynı gerekçe: iş fixture'ları ayrı seed'de doğar. Yük testi
      # bugün PATOS'a bağlı olmasa bile ortamı aynı tutmak (ölçüm karşılaştırılabilir
      # kalsın) ve ileride veri-bağımlı bir senaryo eklenince sessizce düşmemek için.
      - name: Seed fixtures (test iş verisi)
        run: npm run seed:fixtures
      - name: Yük testi (npm run test:load)
        run: npm run test:load

  # ===========================================================================
  # ELECTRON — React 19 / Vite 7 renderer; Vitest (jsdom). Electron binary GEREKMEZ.
  # ===========================================================================
  electron:
    name: Electron (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Electron
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # renderer testleri binary istemez → hızlı/güvenli kurulum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Electron/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test (Vitest)
        run: npm test

  # ===========================================================================
  # MOBİL — Expo 54 / RN 0.81; jest-expo (node ortamı, native build GEREKMEZ).
  # ===========================================================================
  mobile:
    name: Mobil (tsc + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobil/package-lock.json
      - run: npm ci
      - name: Lint (expo lint)
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test (jest-expo)
        run: npm test

  # ===========================================================================
  # E2E — Electron uygulaması gerçekten açılıp Login render oluyor mu (Playwright
  # _electron.launch). Headless Linux'ta xvfb gerekir. continue-on-error: CI'da
  # olası kırılganlık unit job'larını BLOKLAMASIN (E2E sinyali yine görünür).
  # ===========================================================================
  e2e:
    name: Electron E2E (smoke)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: Electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Electron/package-lock.json
      - run: npm ci # E2E electron binary İSTER → ELECTRON_SKIP_BINARY_DOWNLOAD verilmez
      - name: Playwright + Electron sistem bağımlılıkları
        run: npx playwright install-deps
      - name: E2E (build + headless launch)
        run: xvfb-run --auto-servernum npm run e2e
