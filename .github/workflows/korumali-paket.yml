name: Korumalı paket (.jsc)

# =============================================================================
# KORUMALI BACKEND ARTEFAKTLARI — platforma kilitli .jsc'yi HEDEF platformda üretir
# =============================================================================
# Bayt kodu (.jsc) OS + mimari + V8 sürümüne KİLİTLİDİR (2a ölçümü
# docs/design/KOD-KORUMA-OLCUM.md): macOS'ta win/linux .jsc ÜRETİLEMEZ. Bu iş
# akışı windows-latest + ubuntu-latest koşucularında, `deploy/node-surumu.json`in
# pinlediği AYNI Node 24 ile derler; yapıtlar (server.jsc + yükleyici + künye +
# runtime node ikilisi; win-x64 kolunda ayrıca Dağıtım v2'nin iki Rust hizmet
# ikilisi `runtime/tekserp-hizmet.exe` + `runtime/tekserp-guncelleyici.exe`)
# indirilir ve Mac YALNIZ birleştirir + PAKET anahtarıyla imzalar.
#
# ⚠ İMZA ANAHTARI CI'A GİRMEZ. Bu iş akışı hiçbir sır (PAKET imza anahtarı, .env,
#   DB kimliği) kullanmaz; yalnız açık kaynaktan derler. Nihai imza Mac'te.
#
# workflow_dispatch ile ELLE tetiklenir (otomatik push/PR'da KOŞMAZ: .jsc üretimi
# yalnız yayın hazırlığında gerekir, her commit'te değil).
# =============================================================================

# ORTAK PAKET (tek ortak paket O11a): müşteri/kanal girdisi YOK — yapıt müşteri taşımaz, filigran kurulumda.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  korumali:
    strategy:
      fail-fast: false
      matrix:
        include:
          - hedef: win-x64
            runs-on: windows-latest
          - hedef: linux-x64
            runs-on: ubuntu-latest
    name: "Korumalı .jsc — ${{ matrix.hedef }}"
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      # Node sürümü TEK KAYNAK deploy/node-surumu.json — .jsc paketi ÜRETEN Node'un
      # V8'ine kilitlidir, o yüzden çalışma zamanıyla AYNI sürüm kurulur.
      - name: Node sürümünü node-surumu.json'dan oku
        id: nodesurum
        shell: bash
        run: echo "surum=$(node -e "process.stdout.write(require('./deploy/node-surumu.json').surum)")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nodesurum.outputs.surum }}

      - name: Bağımlılıklar (Teks-Erp — esbuild + bytenode dahil)
        working-directory: Teks-Erp
        run: npm ci --no-audit --no-fund

      # Runtime node ikilisini indir + SHA256 doğrula (tek indirici; kayıttan).
      - name: Runtime node ikilisi (SHA doğrulamalı)
        run: node scripts/koruma-runtime-indir.mjs ${{ matrix.hedef }} koruma-cikti

      # Kaynak haritası REPO DIŞI — pakete girmez, yığın çözümü için ayrı artefakt.
      # Ortak paket: güven çapası kipi ÜRETİM (G3), filigranda müşteri/kurulum null.
      - name: Korumalı derleme (esbuild minify → bytenode .jsc)
        working-directory: Teks-Erp
        shell: bash
        env:
          KORUMA_ARSIV_DIZINI: ${{ runner.temp }}/koruma-arsiv
        run: node scripts/build-korumali.mjs --hedef=${{ matrix.hedef }} --cikti=../koruma-cikti/dist

      # .jsc GERÇEKTEN üretildi mi (host==hedef): künyeden ölç, üretilmediyse DUR.
      - name: .jsc üretimini doğrula
        shell: bash
        run: |
          node -e "const k=require('./koruma-cikti/dist/server-kunye.json'); if(!k.jscUretildi){console.error('server.jsc üretilmedi (host hedefe uymadı) — bu koşucu ${{ matrix.hedef }} üretmeli'); process.exit(1)} console.log('jsc',k.jscSha256.slice(0,16),'v8',k.v8Taban)"
          test -f koruma-cikti/dist/server.jsc || { echo "server.jsc yok"; exit 1; }

      # Dağıtım v2: paket runtime\ altına iki Rust hizmet ikilisini taşır (paketle.ps1 -HizmetIkiliDizini
      # <bu yapıtın runtime\ dizini>). Sürüm derlemesi: test-anchor YOK — güven çapası gömülü ve TEK kiptir
      # (`uretim`); bayt kodu künyesi (`guvenCapasi`) başka kip söylerse DUR. Künye ikisini ölçer.
      # Yalnız win-x64 kolu (hizmet düzeni Windows'tadır).
      - name: Rust hizmet ikilileri (güncelleyici + konak, kanalın çapa kipi)
        if: matrix.hedef == 'win-x64'
        shell: pwsh
        working-directory: Teks-Erp/native
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          $kip = (Get-Content -Raw ../../koruma-cikti/dist/server-kunye.json | ConvertFrom-Json).guvenCapasi
          if ($kip -cne "uretim") { Write-Error "bayt kodu künyesinde çapa kipi yok/tanınmıyor (tek kip uretim): '$kip'"; exit 1 }
          cargo build --release --locked -p tekserp-guncelleyici -p tekserp-hizmet
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $k = (& target/release/tekserp-guncelleyici.exe kunye | Out-String) | ConvertFrom-Json
          if ($k.ad -ne "tekserp-guncelleyici" -or $k.testCapasi -ne $false) { Write-Error "güncelleyici sürüm derlemesi değil (testCapasi): $($k | ConvertTo-Json -Compress)"; exit 1 }
          if ($k.capaKipi -cne $kip) { Write-Error "güncelleyici çapa kipi '$($k.capaKipi)', bayt kodu '$kip'"; exit 1 }
          $h = (& target/release/tekserp-hizmet.exe kunye | Out-String) | ConvertFrom-Json
          if ($h.ad -ne "tekserp-hizmet") { Write-Error "konak künyesi beklenen değil"; exit 1 }
          Copy-Item target/release/tekserp-guncelleyici.exe ../../koruma-cikti/runtime/tekserp-guncelleyici.exe
          Copy-Item target/release/tekserp-hizmet.exe ../../koruma-cikti/runtime/tekserp-hizmet.exe
          Get-FileHash ../../koruma-cikti/runtime/tekserp-*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }

      - name: Yapıtları yükle (.jsc + yükleyici + künye + runtime)
        uses: actions/upload-artifact@v4
        with:
          name: korumali-${{ matrix.hedef }}
          path: |
            koruma-cikti/dist/server.jsc
            koruma-cikti/dist/server.js
            koruma-cikti/dist/server-kunye.json
            koruma-cikti/runtime/**
          if-no-files-found: error
          retention-days: 7

      # Kaynak haritası AYRI artefakt (pakete GİRMEZ; yığın izini satırdan kaynağa çevirir).
      - name: Kaynak haritası arşivi (repo dışı → artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: kaynak-haritasi-${{ matrix.hedef }}
          path: ${{ runner.temp }}/koruma-arsiv/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # LINUX GÜNCELLEYİCİ (GUNCELLEYICI-SAGLAMLIK L3): `backend-oci` teslim paketine giren linux-x64 ikilisi.
  # Taban Ubuntu 22.04 (glibc 2.35): eski glibc'de derlenen ikili yenilerde koşar (ileri uyum, R2). Sürüm
  # derlemesi: test-anchor YOK, çapa kipi `uretim`; künye ikilinin KENDİSİNDEN okunur ve yapıta yazılır.
  # `teslim-paketle.sh` künyeyi imajın içinde yeniden ölçer (CI dosyasına güvenmez).
  # TLS sistem OpenSSL'iyle (L4a, native-tls): derleme libssl-dev + pkg-config ister, ikili libssl.so.3'e
  # dinamik bağlanır ⇒ hedef konakta libssl3 gerekir (runbook §1).
  # ---------------------------------------------------------------------------
  guncelleyici-linux:
    name: "Güncelleyici — linux-x64 (Ubuntu 22.04)"
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Teks-Erp/native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust araç zinciri (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Sistem OpenSSL geliştirme paketleri (native-tls)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Sürüm derlemesi (özelliksiz, kilit dosyasıyla)
        run: cargo build --release --locked -p tekserp-guncelleyici
      - name: Künye + ELF + çapa kipi denetimi
        shell: bash
        run: |
          set -eu
          ikili=target/release/tekserp-guncelleyici
          cikti=../../guncelleyici-cikti
          mkdir -p "$cikti"
          file "$ikili" | grep -q 'ELF 64-bit LSB pie executable, x86-64' || { file "$ikili"; echo "linux-x64 ELF değil"; exit 1; }
          "$ikili" kunye > "$cikti/guncelleyici-kunye.json"
          node -e '
            const k = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const e = [];
            if (k.ad !== "tekserp-guncelleyici") e.push("ad " + k.ad);
            if (k.hedef !== "linux") e.push("hedef " + k.hedef);
            if (k.testCapasi !== false) e.push("test çapalı derleme");
            if (k.capaKipi !== "uretim") e.push("çapa kipi " + k.capaKipi);
            if (e.length) { console.error("güncelleyici künyesi sürüm derlemesi değil: " + e.join(", ")); process.exit(1); }
            console.log("künye", JSON.stringify(k));
          ' "$cikti/guncelleyici-kunye.json"
          cp "$ikili" "$cikti/tekserp-guncelleyici"
          ( cd "$cikti" && sha256sum tekserp-guncelleyici guncelleyici-kunye.json | tee SHA256SUMS )
          ldd "$ikili"
          ldd "$ikili" | grep -q 'libssl\.so\.3 => /' || { echo "ikili sistem OpenSSL 3'e (libssl.so.3) bağlı değil — hedef konak beyanı (libssl3) tutmaz"; exit 1; }
      - name: Yapıtı yükle (tekserp-guncelleyici + künye)
        uses: actions/upload-artifact@v4
        with:
          name: guncelleyici-linux-x64
          path: |
            guncelleyici-cikti/tekserp-guncelleyici
            guncelleyici-cikti/guncelleyici-kunye.json
            guncelleyici-cikti/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
