# =============================================================================
# TeksERP VDS — traefik  (2026-09-01)
# =============================================================================
# ⚠️ ESKİ SUNUCUDAN FARKI: ACME (Let's Encrypt) çözücüleri KALDIRILDI.
# Bu makine yalnız guncelleme.etkiliyazilim.com'u servis eder ve o sertifika
# Cloudflare Origin CA'dır (dynamic/tls.yml). ACME'yi taşımak, Cloudflare API
# anahtarını (cf.env) bu makineye de koymak demekti — servis etmediğimiz bir
# özellik için fazladan bir sır. Gerekirse geri eklenir.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: web

api:
  dashboard: true
  insecure: true      # yalnız 127.0.0.1:8080'e bağlanır — SSH tüneliyle erişilir

log:
  level: INFO
accessLog: {}
