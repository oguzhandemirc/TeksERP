user root;   # docker.sock'a (root:docker 660) erisebilmek icin
worker_processes 1;
events { worker_connections 128; }
http {
  access_log off;
  upstream dockersock { server unix:/var/run/docker.sock; }
  server {
    listen 2375;
    location / {
      # Sadece okuma: Traefik yalnizca GET/HEAD kullanir
      limit_except GET HEAD { deny all; }
      rewrite ^/v1\.[0-9]+/(.*)$ /v1.44/$1 break;
      proxy_pass http://dockersock;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
