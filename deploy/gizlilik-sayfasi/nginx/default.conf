# tekserp.etkiliyazilim.com kökeni — yalnız herkese açık yasal sayfalar (bugün tek sayfa: /gizlilik).
# Play şartı: girişsiz, coğrafi kısıtsız, PDF olmayan HTML. Önbellek kısa: metin değişince kenar 5 dk'da tazelenir.
#
# ⚠️ `always` yalnız no-store satırlarında durur: `always` başlığı 404'e de ekler (../guncelleme-sunucusu/README.md ①).
# nginx'te bir konumdaki add_header sunucu düzeyindekileri SİLER; bu yüzden güvenlik başlıkları konum içindedir.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;
    charset utf-8;
    # Yönlendirme göreli: arkada TLS kenarda biter, nginx mutlak adreste http:// yazardı.
    absolute_redirect off;

    location ~ (^|/)\. {
        return 404;
    }

    location = / {
        return 302 /gizlilik;
    }

    location = /gizlilik/ {
        return 301 /gizlilik;
    }

    location = /gizlilik {
        default_type "text/html; charset=utf-8";
        try_files /gizlilik.html =404;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    }

    # Dosya adıyla doğrudan erişim yok: tek adres /gizlilik.
    location / {
        return 404;
    }

    error_page 404 = @bulunamadi;
    location @bulunamadi {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
