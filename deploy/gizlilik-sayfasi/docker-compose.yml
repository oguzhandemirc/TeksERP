name: tekserp-gizlilik

# =============================================================================
# TeksERP herkese açık yasal sayfaları — tekserp.etkiliyazilim.com (bugün yalnız /gizlilik)
# /opt/stack/apps/tekserp-gizlilik/docker-compose.yml
# =============================================================================
# Google Play gizlilik politikası adresi (K2, 2026-10-08): girişsiz, belirteçsiz, PDF olmayan HTML.
# İndirme kökünden (indir.etkiliyazilim.com, Worker her isteği belirteçle kapılar) ve eski güncelleme
# sitesinden TAMAMEN ayrıdır: ayrı proje, konteyner, kök, yönlendirici ve ara katmanlar.
# Kenar zinciri bu servisin KENDİ etiketlerindedir (başka servisin sağlığına bağlanmaz); köken yalnız
# Cloudflare'den gelen isteği kabul eder. TLS: Cloudflare Origin CA `*.etkiliyazilim.com` — DNS kaydı
# proxy AÇIK olmak zorunda. Bütün dosyalar root sahipli; konteyner hiçbir şey yazmaz.
# Bekçi: scripts/test_gizlilik_sayfasi.mjs · kurulum: vds-kur.sh · ölçüm: olc.mjs
# =============================================================================

services:
  web:
    image: nginx:alpine
    container_name: tekserp-gizlilik
    mem_limit: 32m
    memswap_limit: 48m
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - "traefik.http.routers.tekserp-gizlilik.rule=Host(`tekserp.etkiliyazilim.com`)"
      - traefik.http.routers.tekserp-gizlilik.entrypoints=websecure
      - traefik.http.routers.tekserp-gizlilik.tls=true
      - traefik.http.services.tekserp-gizlilik.loadbalancer.server.port=80
      # Kenar zinciri — sıra önemli (deploy/traefik/kenar-zinciri.mjs): önce Cloudflare ipallowlist, sonra hız seddi.
      - traefik.http.routers.tekserp-gizlilik.middlewares=tekserp-gizlilik-cf,tekserp-gizlilik-hiz
      - "traefik.http.middlewares.tekserp-gizlilik-cf.ipallowlist.sourcerange=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - traefik.http.middlewares.tekserp-gizlilik-hiz.ratelimit.average=10
      - traefik.http.middlewares.tekserp-gizlilik-hiz.ratelimit.period=1s
      - traefik.http.middlewares.tekserp-gizlilik-hiz.ratelimit.burst=300
      - traefik.http.middlewares.tekserp-gizlilik-hiz.ratelimit.sourcecriterion.requestheadername=Cf-Connecting-Ip

networks:
  web:
    external: true
