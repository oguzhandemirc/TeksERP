# =============================================================================
# Satıcı — PORTAL GENEL ERİŞİMİ: satıcı portalı internetten (portal.<alan>), Cloudflare proxy + Access arkasında
# =============================================================================
# Ana dosyanın ÜSTÜNE bindirilir; portalın TEK yoludur (tünel yok). ÜRETİMDE ZORUNLU
# (tek portal — kullanıcı kararı 2026-10-05; compose-denetle Ⓞ ölçer):
#   üretim : COMPOSE_FILE=docker-compose.yml:docker-compose.portal-genel.yml[:docker-compose.bildirim.yml]
# Runbook (Cloudflare tarafı · DNS · doğrulama · geri alma): docs/ops/PORTAL-GENEL-ERISIM.md
#
# Dört kapı, dıştan içe (biri düşse de öteki fail-closed kalır):
#   1. Cloudflare Access — e-posta tek kullanımlık kodu, izinli e-posta listesi (kenarda).
#   2. Traefik — portal yönlendiricisi YALNIZ Cloudflare kenar aralıklarından gelen bağlantıyı kabul eder
#      (ipallowlist, varsayılan strateji = TCP karşı ucu; başlık okunmaz) ve kaba hız seddinden geçer. İki halka
#      ana dosyada TEK yerde tanımlıdır (genel yönlendiriciyle ortak `tekserp-satici-${ORTAM}-cf` · `-hiz`); liste
#      `satici/sunucu/src/http/client-address.ts` CLOUDFLARE_NETWORKS ile BİREBİR (bekçi test_erisim_kapisi §5).
#   3. Satıcının ERİŞİM dinleyicisi (4613, kenar adresi, port YAYIMLANMAZ) — her istekte Access JWT'si (RS256 ·
#      AUD · iss · süre · e-posta); yoksa 404. Access ayarı eksikse dinleyici her isteğe 404 (genel portal KAPALI).
#   4. Portal parolası + TOTP; bu yolda YALNIZ izin listesindeki rotalar (satici/sunucu/src/http/erisim-rotalari.ts,
#      opt-in). Satıcı portalının BÜTÜN işlemleri listededir (kök/ara imzası, kullanıcı yönetimi, anahtar kayıtları
#      dahil — kullanıcı kararı 2026-10-04); parolalar Cloudflare kenarında çözülür, Cloudflare hesabı korunur.
#
# SATICI DIŞ BAĞLANTISIZ KALIR (anahtar tutan konteynere çıkış açılmaz): bu dosya satıcıya AĞ EKLEMEZ. Access imza
# anahtarlarını (https://<takım>/cdn-cgi/access/certs) `satici-jwks` yan konteyneri 10 dk'da bir çeker, doğrular ve
# paylaşılan dizine ATOMİK yazar (geçici dosya + rename); satıcı o dizini SALT OKUNUR bağlar. Yan konteyner aynı
# satıcı imajıdır (yeni imaj/paket yok), sır ve anahtar birimi taşımaz, dinlemez; YALNIZ kendi `jwks-cikis`
# köprüsündedir. Çıkışını TCP 443'e daraltmak host kuralıdır (DOCKER-USER, sudo — runbook §5).
#
# Gereken .env satırları (sır DEĞİL):
#   PORTAL_HOST=portal.etkiliyazilim.com
#   CF_ACCESS_TAKIM_ALANI=<takım>.cloudflareaccess.com            (Zero Trust takım alanı)
#   CF_ACCESS_AUD=<Access uygulamasının AUD etiketi, 64 onaltılık>
#   ERISIM_JWKS_DIZINI_HOST=/opt/stack/apps/tekserp-satici-<ortam>/erisim-jwks   (ÖNCEDEN: 10001:10001 0755)
#   JWKS_CIKIS_AGI=172.31.255.0/29                                (`docker network ls` + `ip -4 route` ile çakışmadığı ölçülür)
# =============================================================================

services:
  satici:
    environment:
      PORT_ERISIM: "4613"
      ERISIM_BIND: ${KENAR_IP}
      CF_ACCESS_TAKIM_ALANI: ${CF_ACCESS_TAKIM_ALANI:?CF_ACCESS_TAKIM_ALANI gerekli (<takım>.cloudflareaccess.com)}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?CF_ACCESS_AUD gerekli (Access uygulamasının AUD etiketi)}
      CF_ACCESS_JWKS_DOSYASI: /erisim-jwks/certs.json
    volumes:
      # Yan konteynerin yazdığı JWKS — satıcıda SALT OKUNUR; dizin önceden kurulur (yoksa compose DURUR).
      - type: bind
        source: ${ERISIM_JWKS_DIZINI_HOST:?ERISIM_JWKS_DIZINI_HOST gerekli (10001:10001 0755 dizin)}
        target: /erisim-jwks
        read_only: true
        bind: { create_host_path: false }
    labels:
      # Kapsayıcı artık İKİ Traefik servisi taşır: her yönlendirici kendi servisine AÇIKÇA bağlanır.
      - traefik.http.routers.tekserp-satici-${ORTAM}.service=tekserp-satici-${ORTAM}
      - "traefik.http.routers.tekserp-satici-${ORTAM}-portal.rule=Host(`${PORTAL_HOST:?PORTAL_HOST gerekli (portal.<alan>)}`)"
      - traefik.http.routers.tekserp-satici-${ORTAM}-portal.entrypoints=websecure
      - traefik.http.routers.tekserp-satici-${ORTAM}-portal.tls=true
      - traefik.http.routers.tekserp-satici-${ORTAM}-portal.service=tekserp-satici-${ORTAM}-portal
      - traefik.http.routers.tekserp-satici-${ORTAM}-portal.middlewares=tekserp-satici-${ORTAM}-cf,tekserp-satici-${ORTAM}-hiz
      - traefik.http.services.tekserp-satici-${ORTAM}-portal.loadbalancer.server.port=4613

  satici-jwks:
    image: ${SATICI_IMAJ:?SATICI_IMAJ gerekli}
    container_name: tekserp-satici-${ORTAM:?ORTAM gerekli}-jwks
    # satici-baslat (DB sırrı ister) ATLANIR: yalnız çekici koşar; imajın CMD'si yok sayılır.
    entrypoint: ["node", "/uygulama/dist/jwks-cekici.js"]
    user: "10001:10001"
    environment:
      CF_ACCESS_TAKIM_ALANI: ${CF_ACCESS_TAKIM_ALANI:?CF_ACCESS_TAKIM_ALANI gerekli (<takım>.cloudflareaccess.com)}
      JWKS_DOSYASI: /erisim-jwks/certs.json
      JWKS_CEKIM_DK: "10"
    volumes:
      - type: bind
        source: ${ERISIM_JWKS_DIZINI_HOST:?ERISIM_JWKS_DIZINI_HOST gerekli (10001:10001 0755 dizin)}
        target: /erisim-jwks
        bind: { create_host_path: false }
    tmpfs:
      - /tmp:mode=1777
    networks: [jwks-cikis]
    read_only: true
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    cpus: 0.1
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 20

networks:
  jwks-cikis:
    name: tekserp-satici-${ORTAM:?ORTAM gerekli}-jwks-cikis
    # internal DEĞİL (yalnız JWKS çekimi için dış bağlantı); YALNIZ satici-jwks katılır, üzerinde dinleyici yok.
    ipam:
      config: [{ subnet: "${JWKS_CIKIS_AGI:?JWKS_CIKIS_AGI gerekli (ör. 172.31.255.0/29)}" }]
