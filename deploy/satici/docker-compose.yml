name: tekserp-satici-${ORTAM:?ORTAM gerekli (uretim)}

# =============================================================================
# TeksERP SATICI (lisans) sunucusu — tekserp-vds · /opt/stack/apps/tekserp-satici-<ortam>/
# =============================================================================
# Runbook: docs/ops/SATICI-KURULUM.md (kurulum · doğrulama · geri alma). Bu dosya sunucuya ELLE
# kopyalanır; değerler yanındaki `.env`ten (ornek-uretim.env). Tek ortam: ORTAM=uretim
# (lisans.etkiliyazilim.com · üretim kökü, tören — runbook §13); proje, konteyner, ağ ve DB hacmi adları ORTAM'dan
# türer; host yolları, alt ağlar ve sır grubu .env'dedir.
#
# Üç ağ, üçü de internal — yalnız `ic-api` patron konteyneriyle ORTAK; hiçbiri güncelleme/kiracıyla değil.
# Satıcı HİÇBİR portu yayımlamaz ve dış bağlantısı yoktur; portal `docker-compose.portal-genel.yml`
# örtüsüyle Traefik + Cloudflare Access arkasından açılır (üretimde zorunlu — denetim Ⓞ).
#   kenar   (internal) Traefik ↔ satıcının GENEL dinleyicisi (/v1/*, /q, /bayi/api) ve (örtüyle) ERİŞİM dinleyicisi.
#                      Traefik bu ağa runbook adımıyla bağlanır; `web` ağına satıcı KATILMAZ.
#   ic      (internal) satıcı ↔ kendi PG16'sı ↔ yedek işi. Port yayını YOK.
#   ic-api  (internal) patron bulutu → satıcı iç API'si (/ic/v1/*, 4612). Port yayını YOK. Satıcı kaynağı
#                      YALNIZ patronun sabit adresinden (/32) kabul eder + ortak sır (docker secret); patron
#                      compose'u bu ağa `external` olarak katılır (ayrı dilim). Sır dosyası yoksa iç API açılmaz.
# Docker soketi hiçbir servise BAĞLANMAZ. Kök FS salt okunur · root olmayan kullanıcı · yetenek yok ·
# cgroup CPU/bellek/süreç sınırı (kiracı ya da patron konteyneri satıcıyı aç bırakamasın).
# Budama: telemetri (nonce · yoklama · portal oturumu/işlemi) + ayak izi denetimi (90 gün / 2 yıl)
# süreç içi bakım işinde (BAKIM_ARALIGI_SN; varsayılanlar kodda);
# yedek dosyaları `satici-yedek` döngüsünde (en yeni YEDEK_EN_AZ kopya asla silinmez).
# =============================================================================

x-sertlik: &sertlik
  read_only: true
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  satici-db:
    <<: *sertlik
    image: ${PG_IMAGE:-postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685}
    container_name: tekserp-satici-${ORTAM}-db
    # Resmî imajın `postgres` kullanıcısı (alpine: 70); root'la başlayıp düşmez → yetenek gerekmez.
    user: "70:70"
    group_add: ["${SIR_GID:?SIR_GID gerekli}"]
    environment:
      POSTGRES_USER: satici
      POSTGRES_DB: satici
      POSTGRES_PASSWORD_FILE: /run/secrets/db_parolasi
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "timezone=UTC"]
    secrets: [db_parolasi]
    volumes:
      - satici-pg:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775
      - /tmp:mode=1777
    networks: [ic]
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "satici", "-d", "satici"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  satici:
    <<: *sertlik
    image: ${SATICI_IMAJ:?SATICI_IMAJ gerekli (tekserp-satici:<sha>)}
    container_name: tekserp-satici-${ORTAM}
    user: "10001:10001"
    group_add: ["${SIR_GID}"]
    depends_on:
      satici-db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT_GENEL: "4610"
      GENEL_BIND: ${KENAR_IP:?KENAR_IP gerekli}
      ANAHTAR_DIZINI: /anahtarlar
      # Gömülü güven çapası TEK kiptir (üretim); denetim ⑪ değeri ölçer.
      GUVEN_CAPASI: uretim
      # İstemci IP'si Cloudflare başlığından (hız sınırı). Başlık YALNIZ güvenilen kenardan gelen bağlantıda okunur:
      # soket Traefik'tir (kenar ağı) → güven kararı Traefik'in X-Forwarded-For'a yazdığı son halka CF aralığındaysa.
      VEKIL_IP_BASLIGI: cf-connecting-ip
      IC_VEKIL_AGLARI: ${KENAR_AGI}
      # İç API: kendi köprüsündeki sabit adres; kaynak YALNIZ patron konteyneri (soket adresi, başlık okunmaz).
      PORT_IC: "4612"
      IC_BIND: ${IC_API_IP:?IC_API_IP gerekli}
      IC_KAYNAK_AGLARI: ${PATRON_IC_IP:?PATRON_IC_IP gerekli}/32
      IC_API_BELIRTEC_DOSYASI: /run/secrets/ic_api_belirteci
      # Dağıtım (3d-1): paylaşılan dosya gövdeleri satıcının KENDİ birimine yazılır; ilk kurulum derlemeleri ve
      # güncelleme sunucusunun yayın kökü (html/ + defter/) yalnız OKUNUR. Genel kök /d · /y bağlantısını tam adresle verir.
      DOSYA_DIZINI: /dosyalar
      DERLEME_DIZINI: /derlemeler
      YAYIN_DIZINI: /yayin
      GENEL_KOK_ADRESI: ${GENEL_KOK_ADRESI:?GENEL_KOK_ADRESI gerekli (https://<SATICI_HOST>)}
    secrets: [db_parolasi, ic_api_belirteci]
    volumes:
      # Anahtar birimi SALT OKUNUR: kök (parolalı) · alt/indirme · portal-totp.key · etkinlestirme-kodu.pepper ·
      # modul-kasasi.key — hepsi önceden hazır (`anahtar.ts sirlar-uret`); sunucu eksikse yaratmaz, açılmaz.
      - ${ANAHTAR_DIZINI_HOST:?ANAHTAR_DIZINI_HOST gerekli}:/anahtarlar:ro
      # Kök FS salt okunur → yazılan TEK yol satıcıya ait dosya birimi; derleme ve yayın kökü salt okunur (denetim ⑨).
      - ${DOSYA_DIZINI_HOST:?DOSYA_DIZINI_HOST gerekli}:/dosyalar
      - ${DERLEME_DIZINI_HOST:?DERLEME_DIZINI_HOST gerekli}:/derlemeler:ro
      - ${YAYIN_DIZINI_HOST:?YAYIN_DIZINI_HOST gerekli (güncelleme sunucusu kökü)}:/yayin:ro
    tmpfs:
      - /tmp:mode=1777
    networks:
      kenar: { ipv4_address: "${KENAR_IP}" }
      ic: {}
      ic-api: { ipv4_address: "${IC_API_IP}" }
    cpus: 0.75
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://'+process.env.GENEL_BIND+':4610/saglik',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=tekserp-satici-${ORTAM}-kenar
      - "traefik.http.routers.tekserp-satici-${ORTAM}.rule=Host(`${SATICI_HOST:?SATICI_HOST gerekli}`)"
      - traefik.http.routers.tekserp-satici-${ORTAM}.entrypoints=websecure
      - traefik.http.routers.tekserp-satici-${ORTAM}.tls=true
      - traefik.http.services.tekserp-satici-${ORTAM}.loadbalancer.server.port=4610
      # Kenar zinciri (genel + örtülü portal yönlendiricisi aynı iki halkayı taşır; sıra önemli — deploy/traefik/kenar-zinciri.mjs):
      # 1) yalnız Cloudflare kenarı (TCP karşı ucu; liste satici/sunucu/src/http/client-address.ts CLOUDFLARE_NETWORKS ile birebir)
      # 2) kaba hız seddi gerçek istemci başına (Cf-Connecting-Ip); uygulamanın /v1 sınırının (120/dk) ~10 katı — yoklamayı kesmez.
      - traefik.http.routers.tekserp-satici-${ORTAM}.middlewares=tekserp-satici-${ORTAM}-cf,tekserp-satici-${ORTAM}-hiz
      - "traefik.http.middlewares.tekserp-satici-${ORTAM}-cf.ipallowlist.sourcerange=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - traefik.http.middlewares.tekserp-satici-${ORTAM}-hiz.ratelimit.average=20
      - traefik.http.middlewares.tekserp-satici-${ORTAM}-hiz.ratelimit.period=1s
      - traefik.http.middlewares.tekserp-satici-${ORTAM}-hiz.ratelimit.burst=600
      - traefik.http.middlewares.tekserp-satici-${ORTAM}-hiz.ratelimit.sourcecriterion.requestheadername=Cf-Connecting-Ip

  # Göç TEK SEFERLİK ve ELLE (`--profile goc run --rm satici-goc`): geri alınamaz eşik, önce yedek.
  satici-goc:
    <<: *sertlik
    image: ${SATICI_IMAJ}
    profiles: ["goc"]
    restart: "no"
    user: "10001:10001"
    group_add: ["${SIR_GID}"]
    depends_on:
      satici-db: { condition: service_healthy }
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    secrets: [db_parolasi]
    tmpfs:
      - /tmp:mode=1777
    networks: [ic]
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 100

  satici-yedek:
    <<: *sertlik
    image: ${SATICI_YEDEK_IMAJ:?SATICI_YEDEK_IMAJ gerekli (tekserp-satici-yedek:<sha>)}
    container_name: tekserp-satici-${ORTAM}-yedek
    user: "10001:10001"
    group_add: ["${SIR_GID}"]
    depends_on:
      satici-db: { condition: service_healthy }
    environment:
      YEDEK_ARALIK_SAAT: "${YEDEK_ARALIK_SAAT:-24}"
      YEDEK_SAKLA_GUN: "${YEDEK_SAKLA_GUN:-30}"
      YEDEK_EN_AZ: "${YEDEK_EN_AZ:-7}"
    secrets: [db_parolasi]
    volumes:
      - ${YEDEK_DIZINI_HOST:?YEDEK_DIZINI_HOST gerekli}:/yedek
      - ${YEDEK_ALICI_DIZINI_HOST:?YEDEK_ALICI_DIZINI_HOST gerekli}:/yedek-alici:ro
      - ${ANAHTAR_DIZINI_HOST}:/anahtarlar:ro
    tmpfs:
      - /tmp:mode=1777
    networks: [ic]
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 50

secrets:
  # root:SIR_GID 0440 — yalnız bu projenin konteynerleri (group_add) okur.
  db_parolasi:
    file: ${DB_PAROLA_DOSYASI:?DB_PAROLA_DOSYASI gerekli}
  # Satıcı ↔ patron ortak Bearer'ı (root:SIR_GID 0440; patron aynı değeri KENDİ dizinindeki kopyadan secret olarak alır).
  ic_api_belirteci:
    file: ${IC_API_BELIRTEC_DOSYASI_HOST:?IC_API_BELIRTEC_DOSYASI_HOST gerekli}

volumes:
  satici-pg:
    name: tekserp-satici-${ORTAM}-pg

networks:
  kenar:
    name: tekserp-satici-${ORTAM}-kenar
    internal: true
    # Traefik bu ağa DİNAMİK adresle katılır: dinamik dağıtım ip_range'le sınırlı, satıcının sabit
    # KENAR_IP'si onun DIŞINDA — yoksa satıcıdan önce bağlanan Traefik ilk boş adresi (KENAR_IP) alır
    # ve satıcı "Address already in use" ile açılamaz (VDS kurulumunda ölçüldü).
    ipam:
      config: [{ subnet: "${KENAR_AGI:?KENAR_AGI gerekli}", ip_range: "${KENAR_DINAMIK_ARALIK:?KENAR_DINAMIK_ARALIK gerekli}" }]
  ic:
    name: tekserp-satici-${ORTAM}-ic
    internal: true
  ic-api:
    name: tekserp-satici-${ORTAM}-ic-api
    internal: true
    # Sabit adresler (satıcı IC_API_IP · patron PATRON_IC_IP) dinamik aralığın DIŞINDA: sonradan katılan bir
    # konteyner patronun adresini kapıp kaynak kapısını geçemesin (denetim ⑧).
    ipam:
      config: [{ subnet: "${IC_API_AGI:?IC_API_AGI gerekli}", ip_range: "${IC_API_DINAMIK_ARALIK:?IC_API_DINAMIK_ARALIK gerekli}" }]
