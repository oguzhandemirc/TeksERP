# =============================================================================
# Satıcı — BİLDİRİM YAN KONTEYNERİ (örtü; ana dosyanın ÜSTÜNE bindirilir)
# =============================================================================
# `.env`: COMPOSE_FILE=docker-compose.yml:docker-compose.portal-genel.yml:docker-compose.bildirim.yml (portal örtüsüyle üçü birden). Runbook: docs/ops/SATICI-KURULUM.md §5c.
#
# Satıcı DIŞ BAĞLANTISIZ kalır (anahtar tutuyor): olay, satıcının kendi tx'inde giden kutusuna (`bildirim` tablosu)
# satır yazar. E-posta (Resend HTTP API) ve Telegram (Bot API) çağrısını YALNIZ bu servis yapar — satıcıyla AYNI
# imaj, farklı komut (`node dist/notifications/sender-main.js`; yeni imaj/derleme hattı yok, sürümü satıcıyla kilitli).
#   · ağ: `ic` (internal; YALNIZ satici-db'ye) + `bildirim-cikis` (internal DEĞİL; YALNIZ bu servis katılır, kimse
#     dinlemez; DOCKER-USER ile yalnız tcp/443 + sabit DNS'e daraltılır — `vds/bildirim-cikis.sh`, runbook §5c)
#   · DB rolü `satici_bildirim` (göç: YALNIZ `bildirim`de SELECT + durum kolonlarında UPDATE); parolası ayrı sır
#     `bildirim_db_parolasi`. Satıcının sahip parolası (`db_parolasi`) bu servise BAĞLANMAZ; açılış kapısı fazla
#     yetkili rolü reddeder (`FAZLA yetkili`).
#   · kanal değerleri docker secret DOSYASI (root:SIR_GID 0440; değer koda/runbook'a/.env'e GİRMEZ): `telegram_bot_token`
#     · `telegram_chat_id` (grup kimliği; sıradan grup -<sayı>) · `resend_api_key` — BOŞ dosya = kanal KAPALI (gönderim
#     yok, nabız/günlük "kanal yapılandırılmamış" der). Grup süper gruba taşınırsa satır kalıcı HATA olur ve YENİ
#     kimlik (yalnız sayı) nabızda + portalda görünür → dosyaya yazılıp servis yeniden yaratılır.
#   · e-posta hedefleri ve portal kökü (sır DEĞİL) `.env`den: BILDIRIM_EPOSTA_ALICI · BILDIRIM_EPOSTA_GONDEREN ·
#     BILDIRIM_PORTAL_ADRESI (internet portalının kökü https://<PORTAL_HOST>/portal; boşsa iletide yalnız yol).
#   · birim YOK, port YOK, kök FS salt okunur, /tmp tmpfs (nabız dosyası), cgroup sınırları.
# =============================================================================

services:
  satici-bildirim:
    image: ${SATICI_IMAJ:?SATICI_IMAJ gerekli (tekserp-satici:<sha>)}
    container_name: tekserp-satici-${ORTAM:?ORTAM gerekli}-bildirim
    read_only: true
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    user: "10001:10001"
    group_add: ["${SIR_GID:?SIR_GID gerekli}"]
    depends_on:
      satici-db: { condition: service_healthy }
    # Giriş satici-baslat (imajın ENTRYPOINT'i): DATABASE_URL'i DB_KULLANICI + DB_PAROLA_DOSYASI'ndan kurar.
    command: ["node", "dist/notifications/sender-main.js"]
    # Dış ad çözümü sabit çözücülerden (çıkış kuralı yalnız bunlara 53'ü açar — vds/bildirim-cikis.sh).
    dns: ["${BILDIRIM_DNS_1:-1.1.1.1}", "${BILDIRIM_DNS_2:-9.9.9.9}"]
    environment:
      NODE_ENV: production
      DB_KULLANICI: satici_bildirim
      DB_PAROLA_DOSYASI: /run/secrets/bildirim_db_parolasi
      TELEGRAM_BOT_TOKEN_DOSYASI: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID_DOSYASI: /run/secrets/telegram_chat_id
      RESEND_API_KEY_DOSYASI: /run/secrets/resend_api_key
      BILDIRIM_EPOSTA_ALICI: ${BILDIRIM_EPOSTA_ALICI:-}
      BILDIRIM_EPOSTA_GONDEREN: ${BILDIRIM_EPOSTA_GONDEREN:-}
      BILDIRIM_PORTAL_ADRESI: ${BILDIRIM_PORTAL_ADRESI:-}
      BILDIRIM_NABIZ_DOSYASI: /tmp/satici-bildirim.nabiz
    secrets: [bildirim_db_parolasi, telegram_bot_token, telegram_chat_id, resend_api_key]
    tmpfs:
      - /tmp:mode=1777
    networks: [ic, bildirim-cikis]
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 50
    # Nabız her başarılı turda yazılır: 3 dk'dan eskiyse (DB'ye ulaşamıyor, süreç asılı) sağlıksız. Çıktı kanal
    # durumunu taşır (`docker inspect` → "kanal yapılandırılmamış (RESEND_API_KEY_DOSYASI boş) — gönderim KAPALI").
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs'),p='/tmp/satici-bildirim.nabiz',s=f.statSync(p);process.stdout.write(f.readFileSync(p,'utf8'));process.exit(Date.now()-s.mtimeMs<180000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

secrets:
  # root:SIR_GID 0440 — yalnız gönderici okur (satıcı ve DB bu sırları görmez; role-cli parolayı stdin'den alır).
  bildirim_db_parolasi:
    file: ${BILDIRIM_DB_PAROLA_DOSYASI:?BILDIRIM_DB_PAROLA_DOSYASI gerekli}
  telegram_bot_token:
    file: ${TELEGRAM_BOT_TOKEN_DOSYASI_HOST:?TELEGRAM_BOT_TOKEN_DOSYASI_HOST gerekli (boş dosya = Telegram kapalı)}
  telegram_chat_id:
    file: ${TELEGRAM_CHAT_ID_DOSYASI_HOST:?TELEGRAM_CHAT_ID_DOSYASI_HOST gerekli (grup kimliği; boş dosya = Telegram kapalı)}
  resend_api_key:
    file: ${RESEND_API_KEY_DOSYASI_HOST:?RESEND_API_KEY_DOSYASI_HOST gerekli (boş dosya = e-posta kapalı)}

networks:
  bildirim-cikis:
    # Dış çıkış — internal DEĞİL; YALNIZ satici-bildirim katılır. Alt ağ satıcının/patronun hiçbir ağıyla ve
    # 100.64/10 (CGNAT) · 127/8 ile çakışmaz; DOCKER-USER kuralı bu alt ağa bağlanır (vds/bildirim-cikis.sh).
    name: tekserp-satici-${ORTAM}-bildirim-cikis
    ipam:
      config: [{ subnet: "${BILDIRIM_CIKIS_AGI:?BILDIRIM_CIKIS_AGI gerekli}" }]
