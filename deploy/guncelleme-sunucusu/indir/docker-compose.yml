name: tekserp-indir

# =============================================================================
# TeksERP tek ortak paket indirme kökeni — indir.etkiliyazilim.com
# /opt/stack/apps/tekserp-indir/docker-compose.yml
# =============================================================================
# Yalnız statik dosya: html/<grup>/{electron,mobil,backend}/ (grup = test · oncu · genel).
# Kapı Cloudflare Worker'dadır (../worker/indirme-kapisi.js); bu köken yalnız Cloudflare'den
# gelen isteği kabul eder, aksi hâlde Worker atlanırdı (docs/ops/INDIRME-KAPISI-WORKER.md §5).
#
# Eski güncelleme sitesinden (../docker-compose.yml, yönlendirici `tekserpguncelleme`) TAMAMEN
# ayrıdır: ayrı proje, ayrı konteyner, ayrı kök, ayrı yönlendirici. O siteye dokunulmaz.
#
# Kenar zinciri bu servisin KENDİ etiketlerindedir: satıcının ara katmanına başvurmak indirmeyi
# lisans sunucusunun sağlığına bağlardı (Traefik sağlıksız/başlayan konteynerin etiketlerini
# yok sayar). Liste tek kaynaktan ölçülür: scripts/test_indir_sunucusu.mjs.
#
# TLS: Cloudflare Origin CA `*.etkiliyazilim.com` (Traefik dynamic/tls.yml) — DNS kaydı
# Cloudflare'de proxy AÇIK olmak zorunda.
# Yayın defteri html/'in DIŞINDADIR (../defter, konteynere bağlanmaz).
# =============================================================================

services:
  web:
    image: nginx:alpine
    container_name: tekserp-indir
    mem_limit: 64m
    memswap_limit: 96m
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - "traefik.http.routers.tekserp-indir.rule=Host(`indir.etkiliyazilim.com`)"
      - traefik.http.routers.tekserp-indir.entrypoints=websecure
      - traefik.http.routers.tekserp-indir.tls=true
      - traefik.http.services.tekserp-indir.loadbalancer.server.port=80
      # Kenar zinciri — sıra önemli (deploy/traefik/kenar-zinciri.mjs): önce Cloudflare ipallowlist
      # (TCP karşı ucu), sonra Cf-Connecting-Ip başına hız seddi.
      - traefik.http.routers.tekserp-indir.middlewares=tekserp-indir-cf,tekserp-indir-hiz
      - "traefik.http.middlewares.tekserp-indir-cf.ipallowlist.sourcerange=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - traefik.http.middlewares.tekserp-indir-hiz.ratelimit.average=20
      - traefik.http.middlewares.tekserp-indir-hiz.ratelimit.period=1s
      - traefik.http.middlewares.tekserp-indir-hiz.ratelimit.burst=600
      - traefik.http.middlewares.tekserp-indir-hiz.ratelimit.sourcecriterion.requestheadername=Cf-Connecting-Ip

networks:
  web:
    external: true
