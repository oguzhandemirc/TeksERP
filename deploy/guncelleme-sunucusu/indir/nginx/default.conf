# indir.etkiliyazilim.com kökeni — yol düzeni /<grup>/<ürün>/… (grup: test · oncu · genel;
# ürün: electron · mobil · backend · backend-oci). Önbellek kararını Worker verir; buradaki başlıklar origin'in
# kendi talimatıdır ve Worker'ın değişken dosya kümesiyle (DEGISKEN_DOSYA) aynı ayrımı yapar.
#
# ⚠️ Uzun önbellek başlığında `always` YOKTUR: `always` başlığı 404'e de ekler ve kenar bir 404'ü
# bir hafta tutar (../README.md ①). `always` yalnız no-cache/no-store satırlarında durur.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    # Yayın betiklerinin yarım yüklemeleri (`.yukleniyor-*`, `.son.json.*`) ve her nokta-dosya
    # sunulmaz: yayın tamamlanmadan dışarı görünmesinler.
    location ~ (^|/)\. {
        return 404;
    }

    # Tablet OTA manifesti — üç başlık da sözleşmedir (../nginx/default.conf ile aynı gerekçe);
    # sınırlayıcı mobil/scripts/lib/feed.cjs MULTIPART_BOUNDARY ile aynı (bekçi ölçer).
    # Grup-nötr /ota/<rv>/manifest takma adını Worker çözer; köken yalnız gerçek yolu görür.
    location ~ ^/[^/]+/mobil/ota/[^/]+/manifest(-[0-9]+)?$ {
        default_type "multipart/mixed; boundary=tekserpota";
        add_header expo-protocol-version 1 always;
        add_header expo-sfv-version 0 always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # OTA paket varlıkları — yol damgayı taşır, içerik değişmez.
    location ~ ^/[^/]+/mobil/ota/[^/]+/[0-9]+/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # "Son sürüm nedir" bildirimleri: latest.yml.
    location ~ \.ya?ml$ {
        default_type text/yaml;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # JSON işaretçi ve künyeler (apk/surum.json · backend son.json ve zincirli ikizleri · pg.json).
    location ~ \.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # nginx'in mime tablosunda .apk yok.
    location ~ \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=604800";
    }

    # Değişmez paketler: panel kurulumu + blockmap, backend/PG zip'i, Linux/OCI tar'ı (her sürümün adı/dizini ayrı).
    location ~ \.(exe|blockmap|zip|tar)$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
    }

    # Bulunamayan dosya asla önbelleklenmesin.
    error_page 404 = @bulunamadi;
    location @bulunamadi {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
