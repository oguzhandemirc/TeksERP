server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Dizin listesi KAPALI: yayın klasörü göz gezdirilecek bir yer değil.
    autoindex off;

    # latest.yml = "son sürüm nedir" bildirimi. Bayat sunulursa güncelleme
    # saatlerce gecikir; her istekte tazelensin.
    location ~ \.ya?ml$ {
        default_type text/yaml;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Kurulum paketi ve blockmap: içerikleri DEĞİŞMEZ (her sürümün adı farklı),
    # uzun önbellek güvenli ve tekrar indirmeleri ucuzlatır.
    #
    # ⚠️ Burada `always` YOKTUR ve bu load-bearing: `always`, başlığı HATA
    # yanıtlarına da ekler. Cloudflare origin'in talimatına uyup bir 404'ü de
    # bir hafta önbelleğe alır — yani paket henüz yüklenmemişken o adrese tek
    # bir istek geldiyse, dosya yüklendikten SONRA bile bir hafta 404 dönerdi.
    # (2026-08-26'da tam olarak bu yaşandı: kurulum sırasında yapılan 404
    # sondası önbelleğe girdi ve yüklenen paket görünmedi.)
    location ~ \.(exe|blockmap)$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
    }

    # =========================================================================
    # MOBİL — Android tabletlerin uzaktan güncellemesi (OTA + APK)
    # =========================================================================
    # Reçete: docs/ops/MOBIL-UZAKTAN-GUNCELLEME.md
    # Yol düzeni Electron ile aynı: /<musteri>/<urun>/…  → /adnansahin/mobil/
    #
    # Manifest, `latest.yml`in mobil karşılığıdır: "yeni sürüm nedir" bildirimi.
    # ⚠️ ÜÇ BAŞLIK DA SÖZLEŞMENİN PARÇASI, süs değil:
    #  · `expo-protocol-version` YOKSA istemci manifest'i "eski biçim" sayıp
    #    hata fırlatır ve güncelleme SESSİZCE hiç gelmez.
    #  · `Content-Type` sınırlayıcısı (boundary) YANLIŞSA istemcinin MIME
    #    ayrıştırıcısı gövdeyi hiç göremez; durum "hata" değil "güncelleme yok"
    #    olarak görünür. Sınırlayıcı SABİTTİR ve iki yerde yazılıdır: gövdeyi
    #    üreten `mobil/scripts/lib/feed.cjs` ve başlığı basan BURASI. Bekçi
    #    `Teks-Erp/scripts/test_mobile_update.ts` §9 ikisini karşılaştırır.
    #  · `no-cache` YOKSA yeni yayın saatlerce görünmez (latest.yml ile aynı).
    #
    # ⚠️ REGEX müşteriden ve sürümden BAĞIMSIZ: her yeni müşteride ya da her
    # yeni runtimeVersion'da elle blok eklemek, unutulabilecek bir adım demekti.
    location ~ ^/[^/]+/mobil/ota/[^/]+/manifest(-[0-9]+)?$ {
        default_type "multipart/mixed; boundary=tekserpota";
        add_header expo-protocol-version 1 always;
        add_header expo-sfv-version 0 always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Kurulum dosyası künyesi — latest.yml ile birebir aynı gerekçe.
    location ~ ^/[^/]+/mobil/apk/surum\.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Kurulum dosyası. ⚠️ `default_type` gerekli: nginx'in mime.types tablosunda
    # `.apk` YOK (ölçüldü) ve tip belirtilmezse `application/octet-stream` gider.
    # Bizim akışımızda zararsız (uygulama kurulum niyetini kendi kurar) ama
    # adresi tarayıcıda açan biri için doğru tip fark eder.
    # ⚠️ `always` YOK — yukarıdaki .exe kuralının aynı gerekçesi (404'ü bir
    # hafta önbelleğe aldırır).
    location ~ ^/[^/]+/mobil/apk/.+\.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=604800";
    }

    # Paket varlıkları — yol damgayı taşır, içerik DEĞİŞMEZ.
    location ~ ^/[^/]+/mobil/ota/[^/]+/[0-9]+/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # İkinci hat: bulunamayan dosya ASLA önbelleklenmesin. Yukarıdaki kural
    # yeterli olmalı, ama yayın akışının en kırılgan anı "dosya birazdan
    # gelecek" penceresidir; oraya kalıcı bir 404 çakılmasın.
    error_page 404 = @bulunamadi;
    location @bulunamadi {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
