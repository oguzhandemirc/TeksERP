name: tekserp-guncelleme

# =============================================================================
# TeksERP güncelleme yayını — guncelleme.etkiliyazilim.com
# /opt/stack/apps/tekserp-guncelleme/docker-compose.yml
# =============================================================================
# Fabrikadaki Electron panelleri yeni sürümü buradan indirir. Servis edilen şey
# yalnız statik dosyalardır (latest.yml + Setup.exe + .exe.blockmap) — uygulama
# mantığı YOK, veritabanı YOK.
#
# Reçete: tekserp reposunda docs/ops/ELECTRON-OTOMATIK-GUNCELLEME.md
#
# Yollar ürüne göre ayrılır: /electron/ (masaüstü paneli). İleride mobil APK
# yayını gerekirse /mobil/ olarak aynı servise eklenir — ayrı konteyner değil.
#
# ⚠️ TLS: certresolver YOK. `etkiliyazilim.com` bu Cloudflare hesabının
# zone'unda olmadığı için DNS-01 çalışmıyor; sertifika **Cloudflare Origin CA**
# olarak traefik/dynamic/tls.yml üzerinden default store'a yükleniyor ve
# `*.etkiliyazilim.com` wildcard'ı bu alt alan adını da kapsıyor.
# Origin CA sertifikasına YALNIZ Cloudflare Edge güvenir → bu kaydın
# Cloudflare'de **proxy'si AÇIK (turuncu bulut)** olmak ZORUNDA. DNS-only (gri)
# bırakılırsa electron-updater sertifikayı reddeder ve güncelleme hiç çalışmaz.
#
# ⚠️ Dosyalar `tekserp-demo` konteynerinin İÇİNE konulmadı (public/ altına).
# Orası imajın parçası: demo her yeniden derlendiğinde yayın silinirdi. Ayrı
# servis + host dizini = deploy'lardan bağımsız kalıcılık.
# =============================================================================

services:
  web:
    image: nginx:alpine
    container_name: tekserp-guncelleme
    # Statik dosya servisi; komşu placeholder ile aynı bütçe.
    mem_limit: 64m
    memswap_limit: 96m
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - "traefik.http.routers.tekserpguncelleme.rule=Host(`guncelleme.etkiliyazilim.com`)"
      - traefik.http.routers.tekserpguncelleme.entrypoints=websecure
      - traefik.http.routers.tekserpguncelleme.tls=true
      - traefik.http.services.tekserpguncelleme.loadbalancer.server.port=80

networks:
  web:
    external: true
